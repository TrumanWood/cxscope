<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CxScope · Checkmarx One 漏洞看板</title>
<style>
/*__CORE_CSS__*/

/* ============================ 应用布局（Demo 1 经典控制台） ============================ */
body {
  background: linear-gradient(180deg, #f4f7fb 0%, #edf1f7 55%, #e9eef6 100%);
}

#app { height: 100vh; display: flex; flex-direction: column; min-height: 0; }

/* 顶栏 */
.topbar {
  flex: none; height: 62px; display: flex; align-items: center; gap: 16px;
  padding: 0 20px; background: var(--panel);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 1px 0 rgba(15, 23, 42, .02), 0 8px 24px -22px rgba(15, 23, 42, .35);
  position: relative; z-index: 30;
}
.brand { display: flex; align-items: center; gap: 10px; flex: none; }
.brand .logo {
  width: 31px; height: 31px; border-radius: 9px;
  background: linear-gradient(135deg, #2563eb, #06b6d4);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 800; font-size: 12.5px; letter-spacing: -.5px;
  box-shadow: 0 5px 14px rgba(37, 99, 235, .32);
}
.brand .name { font-size: 14.5px; font-weight: 750; letter-spacing: -.25px; line-height: 1.15; }
.brand .sub { font-size: 10.5px; color: var(--faint); letter-spacing: .2px; }

/* 顶栏筛选（项目 / 分支 / 扫描时间 同一排） */
.filter-row { display: flex; align-items: center; gap: 9px; flex: 1; min-width: 0; padding-left: 6px; flex-wrap: nowrap; }
.picker-wrap { position: relative; flex: none; }
#projectMenu { top: calc(100% + 7px); left: 0; width: 320px; max-height: 460px; display: flex; flex-direction: column; }
/* 项目多选下拉：勾选只改草稿，底部「取消 / 应用」 */
#projectMenu .proj-list { max-height: 320px; overflow-y: auto; min-height: 0; }
#projectMenu .proj-empty { padding: 16px 8px; color: var(--faint); font-size: 12px; text-align: center; }
/* 项目搜索：实时过滤项目名（纯前端，不查询数据） */
#projectMenu .proj-search {
  flex: none; display: flex; align-items: center; gap: 7px;
  height: 32px; margin: 0 2px 6px; padding: 0 8px;
  border: 1px solid var(--border); border-radius: var(--radius-xs);
  background: var(--panel-2); color: var(--faint);
  transition: border-color .15s, box-shadow .15s, background .15s;
}
#projectMenu .proj-search:focus-within {
  border-color: var(--primary); background: var(--panel);
  box-shadow: 0 0 0 3px var(--primary-ring);
}
#projectMenu .proj-search .s-icon { flex: none; font-size: 11.5px; line-height: 1; opacity: .85; }
#projectMenu .proj-search input {
  flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
  color: var(--text); font-size: 12.5px; line-height: 1;
}
#projectMenu .proj-search input::placeholder { color: var(--faint); }
#projectMenu .proj-search .s-clear {
  flex: none; width: 18px; height: 18px; padding: 0; border: 0; border-radius: 4px;
  background: transparent; color: var(--faint); font-size: 11px; line-height: 18px;
  text-align: center; cursor: pointer;
}
#projectMenu .proj-search .s-clear:hover { background: var(--panel-3); color: var(--text); }
#projectMenu .proj-item.is-hidden { display: none; }
#projectMenu .proj-item .p-name mark {
  background: color-mix(in srgb, var(--primary) 16%, transparent);
  color: inherit; border-radius: 3px; padding: 0 1px;
}
#projectMenu .proj-empty[hidden] { display: none; }
#projectMenu .proj-empty.no-match { padding: 14px 8px; line-height: 1.7; }
.popover .pop-foot {
  flex: none; display: flex; align-items: center; gap: 8px;
  margin-top: 6px; padding: 8px 4px 1px;
  border-top: 1px solid var(--border);
}
.popover .pop-foot .draft-count { color: var(--faint); font-size: 11.5px; }
.popover .pop-foot .spacer { flex: 1; }
.control.link-btn { color: var(--muted); }
.control.link-btn:hover { color: var(--primary); border-color: var(--primary); }
.topbar-actions { display: flex; align-items: center; gap: 8px; flex: none; }

/* 看板工具条 */
.board-toolbar {
  flex: none; display: flex; align-items: center; justify-content: space-between;
  gap: 14px; padding: 12px 20px 11px; flex-wrap: wrap;
}
.sev-chips { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.sev-chips .divider-v { width: 1px; height: 20px; background: var(--border-strong); margin: 0 4px; opacity: .7; }
.total-chip { color: var(--muted); font-size: 12px; margin-left: 2px; }
.total-chip b { color: var(--text); font-weight: 750; }
.toolbar-right { display: flex; align-items: center; gap: 8px; }
.count { color: var(--faint); font-size: 12px; padding: 0 4px; }

/* 看板主体：占满剩余高度，仅表格内部滚动 */
.board { flex: 1; min-height: 0; padding: 0 20px 18px; display: flex; position: relative; }
.board .table-wrap { flex: 1; box-shadow: 0 10px 30px -26px rgba(15, 23, 42, .5); }

table.results thead th { padding-top: 11px; padding-bottom: 11px; }
table.results tbody tr { height: 50px; }
.empty-row .empty-state { height: 320px !important; }

/* 加载遮罩 */
.board-loading {
  position: absolute; inset: 0; z-index: 8;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  background: color-mix(in srgb, var(--panel) 72%, transparent);
  backdrop-filter: blur(2px); border-radius: var(--radius);
  color: var(--muted); font-size: 13px;
}
.board-loading .big-spinner {
  width: 26px; height: 26px; border-radius: 50%;
  border: 3px solid var(--primary-soft); border-top-color: var(--primary);
  animation: spin .8s linear infinite;
}
.board-loading .sub { color: var(--faint); font-size: 11.5px; }

/* 空数据提示 */
.empty-state .action-row { margin-top: 12px; display: flex; gap: 8px; }

/* 抽屉拖拽调整宽度（Demo 1 抽屉专用） */
#detailDrawer { width: 520px; }
.drawer-resizer {
  position: absolute; left: 0; top: 0; bottom: 0; width: 8px; z-index: 6;
  cursor: col-resize; touch-action: none;
}
.drawer-resizer::after {
  content: ""; position: absolute; left: 3px; top: 0; bottom: 0; width: 2px;
  background: transparent; border-radius: 2px;
  transition: background .15s, box-shadow .15s;
}
.drawer-resizer:hover::after,
.drawer-resizer.dragging::after {
  background: var(--primary);
  box-shadow: 0 0 0 1px var(--primary-ring);
}
body.drawer-resizing { cursor: col-resize; user-select: none; }
body.drawer-resizing * { cursor: col-resize !important; user-select: none !important; }
body.drawer-resizing #detailDrawer { transition: none; }

/* 详情区块标题右侧的一键复制（漏洞说明 / 攻击向量 / 污点数据流 / 修复建议 / 参考链接） */
.dt-sec h4 .sec-copy {
  margin-left: auto; flex: none;
  height: 22px; padding: 0 8px; font-size: 11px; font-weight: 600;
}
.dt-sec h4 .count + .sec-copy { margin-left: 0; }

/* 漏洞名称一行右侧：复制完整漏洞信息 */
.dt-title-row .dt-actions-top { flex: none; margin-top: 1px; }
.dt-title-row .dt-copy-all {
  height: 26px; padding: 0 9px; font-size: 11.5px; font-weight: 600; white-space: nowrap;
}

/* 登录附加 */
.login-card .proxy-hint {
  margin-top: 12px; padding: 9px 11px; border-radius: var(--radius-sm);
  background: var(--med-soft); border: 1px dashed color-mix(in srgb, var(--med) 40%, transparent);
  color: var(--text-2); font-size: 11.5px; line-height: 1.65;
}
.login-card .proxy-hint code { background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-family: var(--mono); font-size: 11px; }
.login-card .remember { display: flex; align-items: center; gap: 7px; margin-top: 12px; color: var(--muted); font-size: 12px; }
.login-card .remember input { width: 14px; height: 14px; accent-color: var(--primary); }

/* 扫描链接弹窗 */
.link-help { color: var(--muted); font-size: 12px; line-height: 1.7; margin-bottom: 10px; }
.link-help code { background: var(--panel-2); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-family: var(--mono); font-size: 11px; }

/* 扫描进度（真实轮询） */
.scan-prog-row .bar > i.indeterminate {
  background: linear-gradient(90deg, var(--primary), #06b6d4, var(--primary));
  background-size: 200% 100%; animation: barSlide 1.4s linear infinite;
}
@keyframes barSlide { from { background-position: 0 0; } to { background-position: -200% 0; } }

/* 本地扫描弹窗：分支可编辑下拉 / 失败详情块 / 最小化浮动条 */
#scanModal .modal { width: 860px; }
#scanModal .modal-body { overflow-x: hidden; }
.scan-options .opt.branch-opt { flex: 1 1 340px; min-width: 280px; align-items: flex-start; }
.branch-field { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.branch-field input[type="text"] { width: 156px; min-width: 0; }
.branch-field .bp-toggle { flex: none; width: 26px; height: 30px; padding: 0; border: 1px solid var(--border-strong); border-radius: var(--radius-xs); background: var(--panel); color: var(--muted); font-size: 11px; line-height: 1; cursor: pointer; }
.branch-field .bp-toggle:hover { border-color: var(--primary); color: var(--primary); }
.branch-field .bp-refresh { flex: none; width: 30px; height: 30px; padding: 0; font-size: 12px; line-height: 1; }
.branch-hint { color: var(--faint); font-size: 10.8px; line-height: 1.45; max-width: 380px; word-break: break-word; }
.branch-hint.warn { color: var(--high); }
/* 分支下拉浮层：挂在 body 上，避免被弹窗 overflow 裁剪 */
.bp-menu { position: fixed; z-index: 99; max-height: 260px; overflow-y: auto; overflow-x: hidden; padding: 5px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-sm); box-shadow: var(--shadow-lg); }
.bp-menu.hidden { display: none; }
.bp-menu .bp-group { padding: 5px 8px 3px; color: var(--faint); font-size: 10.5px; letter-spacing: .3px; }
.bp-menu .bp-item { display: block; width: 100%; text-align: left; padding: 6px 8px; border: 0; border-radius: var(--radius-xs); background: transparent; color: var(--text-2); font-size: 12px; font-family: var(--mono); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bp-menu .bp-item:hover, .bp-menu .bp-item:focus { outline: none; background: var(--primary-soft); color: var(--primary); }
.bp-menu .bp-item.on { color: var(--primary); font-weight: 700; }
.bp-menu .bp-empty { padding: 10px 8px; color: var(--faint); font-size: 11.5px; line-height: 1.6; }
/* 本地扫描：项目名组合框（从已有 Checkmarx One 项目筛选 / 新建项目） */
.scan-folder-row .pname-wrap { position: relative; display: flex; align-items: center; min-width: 0; }
.scan-folder-row .pname-wrap input.pname { padding-right: 84px; }
.scan-folder-row .pn-toggle {
  position: absolute; right: 3px; top: 50%; transform: translateY(-50%);
  width: 24px; height: 24px; padding: 0; border: 0; border-radius: 4px;
  background: transparent; color: var(--faint); font-size: 11px; line-height: 1; cursor: pointer;
}
.scan-folder-row .pn-toggle:hover { background: var(--panel-3); color: var(--primary); }
.scan-folder-row .pn-badge {
  position: absolute; right: 29px; top: 50%; transform: translateY(-50%);
  display: none; padding: 1px 6px; border-radius: 999px;
  font-size: 9.5px; line-height: 1.5; letter-spacing: .2px; white-space: nowrap;
  pointer-events: none;
}
.scan-folder-row[data-pstate="existing"] .pn-badge { display: inline-block; color: var(--ok); background: var(--ok-soft); }
.scan-folder-row[data-pstate="new"] .pn-badge { display: inline-block; color: var(--med); background: var(--med-soft); }
/* 项目名下拉浮层：挂在 body 上，避免被弹窗 overflow 裁剪 */
.pn-menu {
  position: fixed; z-index: 99; display: flex; flex-direction: column;
  max-height: 300px; padding: 5px; background: var(--panel);
  border: 1px solid var(--border); border-radius: var(--radius-sm); box-shadow: var(--shadow-lg);
}
.pn-menu.hidden { display: none; }
.pn-head { flex: none; display: flex; align-items: center; gap: 7px; padding: 2px 5px 6px; border-bottom: 1px solid var(--border); color: var(--faint); font-size: 10.5px; letter-spacing: .3px; }
.pn-head .spacer { flex: 1; }
.pn-head .pn-loading { color: var(--primary); }
.pn-head .pn-refresh { flex: none; width: 22px; height: 22px; padding: 0; border: 0; border-radius: 4px; background: transparent; color: var(--faint); font-size: 12px; line-height: 1; cursor: pointer; }
.pn-head .pn-refresh:hover { background: var(--panel-3); color: var(--primary); }
.pn-list { min-height: 0; overflow-y: auto; overflow-x: hidden; }
.pn-item { display: flex; align-items: center; gap: 7px; width: 100%; padding: 6px 8px; border: 0; border-radius: var(--radius-xs); background: transparent; color: var(--text-2); font-size: 12px; text-align: left; cursor: pointer; }
.pn-item .pn-dot { flex: none; width: 7px; height: 7px; border-radius: 50%; }
.pn-item .pn-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pn-item .pn-name mark { background: color-mix(in srgb, var(--primary) 16%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }
.pn-item:hover, .pn-item.active { outline: none; background: var(--primary-soft); color: var(--primary); }
.pn-item.pn-new { color: var(--primary); font-weight: 650; }
.pn-item.pn-new .pn-plus { flex: none; font-weight: 800; }
.pn-item.pn-new .pn-sub { margin-left: auto; color: var(--faint); font-size: 10px; font-weight: 500; }
.pn-empty { padding: 10px 8px; color: var(--faint); font-size: 11.5px; line-height: 1.6; }
.pn-foot { flex: none; margin-top: 3px; padding: 6px 6px 2px; border-top: 1px solid var(--border); color: var(--faint); font-size: 10.5px; line-height: 1.5; }
/* 本地扫描：「最近扫描」记忆（文件夹路径 + Checkmarx One 项目名，一键填入） */
.scan-recent { margin-top: 10px; min-width: 0; }
.scan-recent.hidden { display: none; }
.scan-recent-head { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; color: var(--faint); font-size: 10.5px; letter-spacing: .3px; }
.scan-recent-head .sr-sub { letter-spacing: 0; word-break: break-word; }
.scan-recent-head .spacer { flex: 1; }
.scan-recent-head .sr-clear {
  flex: none; padding: 2px 6px; border: 0; border-radius: 4px; background: transparent;
  color: var(--faint); font-size: 10.5px; cursor: pointer;
}
.scan-recent-head .sr-clear:hover { color: var(--high); background: var(--high-soft); }
.sr-chips { display: flex; flex-wrap: wrap; gap: 6px; max-height: 76px; overflow-y: auto; overflow-x: hidden; min-width: 0; }
.sr-chip {
  display: inline-flex; align-items: baseline; gap: 7px; max-width: 100%; min-width: 0;
  padding: 5px 9px; border: 1px solid var(--border); border-radius: 999px;
  background: var(--panel); color: var(--text-2); font-size: 11.5px; cursor: pointer;
}
.sr-chip:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
.sr-chip .sr-name { flex: none; max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 650; }
.sr-chip .sr-path { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--faint); font-family: var(--mono); font-size: 10.5px; }
#scanModal .scan-prog-row .st { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.scan-errors {
  margin-top: 12px; padding: 10px 12px; border-radius: var(--radius-sm);
  background: var(--high-soft); border: 1px solid color-mix(in srgb, var(--high) 32%, transparent);
  color: var(--text-2); font-size: 11.8px; line-height: 1.6;
  max-height: 190px; overflow-y: auto; overflow-x: hidden;
}
.scan-errors .se-head { display: flex; align-items: center; gap: 8px; color: var(--high); font-weight: 700; margin-bottom: 6px; }
.scan-errors .se-head .spacer { flex: 1; }
.scan-errors .se-item + .se-item { margin-top: 8px; padding-top: 8px; border-top: 1px dashed color-mix(in srgb, var(--high) 26%, transparent); }
.scan-errors .se-who { font-weight: 650; color: var(--text); word-break: break-all; }
.scan-errors .se-msg { color: var(--muted); font-family: var(--mono); font-size: 11px; white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; }
.scan-mini {
  position: fixed; left: 20px; bottom: 20px; z-index: 95;
  display: flex; align-items: center; gap: 9px;
  max-width: min(520px, calc(100vw - 40px));
  padding: 9px 12px; border-radius: 10px;
  background: var(--panel); border: 1px solid var(--border-strong);
  box-shadow: 0 12px 30px -18px rgba(15, 23, 42, .5);
  font-size: 12px; color: var(--text-2); cursor: pointer;
}
.scan-mini.hidden { display: none; }
.scan-mini .sm-dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--primary); color: var(--primary); animation: pulse 1.2s infinite; }
.scan-mini.done .sm-dot { background: var(--ok); color: var(--ok); animation: none; }
.scan-mini.err .sm-dot { background: var(--high); color: var(--high); animation: none; }
.scan-mini .sm-text { font-weight: 650; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scan-mini .sm-sub { color: var(--faint); font-size: 11px; white-space: nowrap; }
.scan-mini .sm-x { flex: none; width: 22px; height: 22px; padding: 0; border: 0; border-radius: 4px; background: transparent; color: var(--faint); font-size: 11px; cursor: pointer; }
.scan-mini .sm-x:hover { background: var(--panel-3); color: var(--text); }

/* 小型提示 */
.hint-line { color: var(--faint); font-size: 11.5px; }

@media (max-width: 1280px) {
  .brand .sub { display: none; }
  .searchbox { min-width: 170px; }
}
@media (max-width: 1080px) {
  .topbar { height: auto; flex-wrap: wrap; padding: 10px 14px; gap: 10px; }
  .filter-row { order: 3; width: 100%; padding-left: 0; flex-wrap: wrap; }
}
</style>
</head>
<body class="locked">
<div id="app">

  <!-- ======================= 顶栏：项目 / 分支 / 扫描时间 同一排 ======================= -->
  <header class="topbar">
    <div class="brand">
      <div class="logo">CX</div>
      <div>
        <div class="name">CxScope</div>
        <div class="sub">Checkmarx One · SAST 漏洞看板</div>
      </div>
    </div>

    <div class="filter-row">
      <div class="picker-wrap">
        <button class="control" id="projectPickerBtn" type="button" title="选择项目（可多选，勾选后点「应用」）">
          <span class="lbl">项目</span>
          <span class="val">选择项目</span>
          <span class="caret">▾</span>
        </button>
        <div class="popover hidden" id="projectMenu"></div>
      </div>
      <label class="control" title="按分支筛选">
        <span class="lbl">分支</span>
        <select id="branchSelect"><option value="">全部分支</option></select>
      </label>
      <label class="control" title="按扫描时间筛选">
        <span class="lbl">扫描时间</span>
        <select id="scanSelect"><option value="">最新扫描</option></select>
      </label>
      <button class="control link-btn" id="openLinkBtn" type="button" title="粘贴 Checkmarx 扫描页面链接，直接打开对应扫描结果">
        🔗 扫描链接
      </button>
    </div>

    <div class="topbar-actions">
      <span class="conn-pill" id="connPill"><span class="pulse"></span>未连接</span>
      <button class="btn primary" id="localScanBtn" type="button">＋ 本地扫描</button>
      <button class="icon-btn" id="settingsBtn" type="button" title="连接设置">⚙</button>
    </div>
  </header>

  <!-- ======================= 严重级别筛选 + 搜索 ======================= -->
  <section class="board-toolbar">
    <div class="sev-chips" id="sevChips">
      <button class="sev-chip on" data-sev="CRITICAL" type="button"><span class="dot"></span>Critical <span class="n" data-count>0</span></button>
      <button class="sev-chip on" data-sev="HIGH" type="button"><span class="dot"></span>High <span class="n" data-count>0</span></button>
      <button class="sev-chip on" data-sev="MEDIUM" type="button"><span class="dot"></span>Medium <span class="n" data-count>0</span></button>
      <button class="sev-chip on" data-sev="LOW" type="button"><span class="dot"></span>Low <span class="n" data-count>0</span></button>
      <button class="sev-chip on" data-sev="INFO" type="button"><span class="dot"></span>Info <span class="n" data-count>0</span></button>
      <span class="divider-v"></span>
      <span class="total-chip">当前共 <b id="totalCount">0</b> 个漏洞</span>
    </div>
    <div class="toolbar-right">
      <label class="searchbox">🔍<input id="searchInput" type="text" placeholder="搜索漏洞 / 文件 / CWE / 描述…" /></label>
      <span class="count" id="resultCount"></span>
      <button class="btn ghost" id="refreshBtn" type="button" title="重新拉取扫描与结果">刷新</button>
      <button class="btn ghost" id="exportBtn" type="button">导出 CSV</button>
    </div>
  </section>

  <!-- ======================= 结果表格（内部滚动） ======================= -->
  <main class="board">
    <div class="table-wrap">
      <table class="results">
        <thead id="resultsHead"></thead>
        <tbody id="resultsBody"></tbody>
      </table>
      <div class="board-loading hidden" id="boardLoading">
