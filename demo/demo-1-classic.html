<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CxScope · Demo 1 经典控制台（抽屉详情）</title>
<style>
/* ==========================================================================
   Checkmarx 漏洞看板 · 共用组件样式（三套 Demo 共用）
   ========================================================================== */

*, *::before, *::after { box-sizing: border-box; }

:root {
  --bg: #edf1f7;
  --bg-soft: #f5f7fb;
  --panel: #ffffff;
  --panel-2: #f8fafc;
  --panel-3: #f1f5f9;
  --border: #e2e8f0;
  --border-strong: #cbd5e1;
  --text: #0f172a;
  --text-2: #334155;
  --muted: #64748b;
  --faint: #94a3b8;

  --primary: #2563eb;
  --primary-2: #1d4ed8;
  --primary-soft: #e8efff;
  --primary-ring: rgba(37, 99, 235, .22);

  --crit: #b91c1c;
  --crit-soft: #fdecec;
  --high: #dc2626;
  --high-soft: #fdeaea;
  --med: #d97706;
  --med-soft: #fdf3e2;
  --low: #a16207;
  --low-soft: #fdf6db;
  --info: #64748b;
  --info-soft: #eef1f5;

  --ok: #15803d;
  --ok-soft: #e7f7ee;
  --warn: #b45309;

  --radius: 12px;
  --radius-sm: 8px;
  --radius-xs: 6px;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, .06);
  --shadow: 0 10px 28px rgba(15, 23, 42, .12);
  --shadow-lg: 0 24px 64px rgba(15, 23, 42, .22);

  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --mono: "SFMono-Regular", "Cascadia Code", Consolas, "JetBrains Mono", "Liberation Mono", monospace;

  --header-h: 58px;
  --toolbar-h: 52px;
}

body[data-theme="dark"] {
  --bg: #060b16;
  --bg-soft: #0a1322;
  --panel: #0e1830;
  --panel-2: #121d38;
  --panel-3: #172444;
  --border: #1e2d4f;
  --border-strong: #2b3f6b;
  --text: #e8eefb;
  --text-2: #c3cfe6;
  --muted: #8b9cc0;
  --faint: #64769c;

  --primary: #3b82f6;
  --primary-2: #2563eb;
  --primary-soft: #15264f;
  --primary-ring: rgba(59, 130, 246, .3);

  --crit: #f87171;
  --crit-soft: rgba(248, 113, 113, .14);
  --high: #fb7185;
  --high-soft: rgba(251, 113, 133, .13);
  --med: #fbbf24;
  --med-soft: rgba(251, 191, 36, .12);
  --low: #facc15;
  --low-soft: rgba(250, 204, 21, .1);
  --info: #94a3b8;
  --info-soft: rgba(148, 163, 184, .13);

  --ok: #34d399;
  --ok-soft: rgba(52, 211, 153, .12);
  --warn: #fbbf24;

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .35);
  --shadow: 0 14px 38px rgba(0, 0, 0, .5);
  --shadow-lg: 0 30px 80px rgba(0, 0, 0, .65);
}

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  line-height: 1.55;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--primary); text-decoration: none; }
a:hover { text-decoration: underline; }
::selection { background: var(--primary); color: #fff; }
.mono { font-family: var(--mono); font-size: 12px; }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.nowrap { white-space: nowrap; }

*::-webkit-scrollbar { width: 9px; height: 9px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }
*::-webkit-scrollbar-thumb:hover { background: var(--faint); border: 2px solid transparent; background-clip: content-box; }

:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

/* --------------------------------------------------------------------------
   锁定态（登录遮罩打开时）
   -------------------------------------------------------------------------- */
body.locked #app { filter: blur(3px) saturate(.9); pointer-events: none; user-select: none; }

/* --------------------------------------------------------------------------
   按钮
   -------------------------------------------------------------------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 34px; padding: 0 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text-2);
  font-size: 13px; font-weight: 500;
  white-space: nowrap;
  transition: background .15s, border-color .15s, color .15s, box-shadow .15s, transform .05s;
}
.btn:hover { background: var(--panel-2); border-color: var(--border-strong); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; box-shadow: 0 6px 16px var(--primary-ring); }
.btn.primary:hover { background: var(--primary-2); border-color: var(--primary-2); }
.btn.soft { background: var(--primary-soft); border-color: transparent; color: var(--primary); }
.btn.soft:hover { background: var(--primary-soft); border-color: var(--primary); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { background: var(--panel-3); color: var(--text); }
.btn.danger { color: var(--high); border-color: var(--high-soft); background: var(--high-soft); }
.btn.block { width: 100%; }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12px; border-radius: var(--radius-xs); }
.btn[disabled] { opacity: .55; cursor: not-allowed; }

.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 34px; height: 34px; border-radius: var(--radius-sm);
  border: 1px solid transparent; background: transparent; color: var(--muted);
  font-size: 15px; line-height: 1;
  transition: background .15s, color .15s, border-color .15s;
}
.icon-btn:hover { background: var(--panel-3); color: var(--text); border-color: var(--border); }
.icon-btn:disabled { opacity: .3; cursor: default; background: transparent; border-color: transparent; }
.empty-row td { padding: 0 !important; border: 0 !important; }
table.results tbody tr { height: 48px; }
.proj-cell { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--text-2); white-space: nowrap; }

.spinner {
  width: 14px; height: 14px; border-radius: 50%;
  border: 2px solid currentColor; border-right-color: transparent;
  animation: spin .7s linear infinite; display: inline-block;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* --------------------------------------------------------------------------
   表单控件 / 筛选条
   -------------------------------------------------------------------------- */
.control {
  display: inline-flex; align-items: center; gap: 8px;
  height: 34px; padding: 0 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--panel);
  color: var(--text-2);
  font-size: 12.5px;
  white-space: nowrap;
  transition: border-color .15s, box-shadow .15s;
}
.control:hover { border-color: var(--border-strong); }
.control:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-ring); }
.control > .lbl { color: var(--faint); font-size: 11.5px; display: inline-flex; align-items: center; gap: 4px; }
.control > .val { font-weight: 600; color: var(--text); max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
.control select {
  border: 0; outline: 0; background: transparent; color: var(--text);
  font-weight: 600; font-size: 12.5px; max-width: 210px; cursor: pointer;
}
.control select:disabled { color: var(--faint); cursor: not-allowed; }
.control .caret { color: var(--faint); font-size: 10px; }

.searchbox {
  display: inline-flex; align-items: center; gap: 7px;
  height: 34px; padding: 0 11px; min-width: 240px;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--panel); color: var(--faint);
  transition: border-color .15s, box-shadow .15s;
}
.searchbox:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-ring); }
.searchbox input { border: 0; outline: 0; background: transparent; flex: 1; color: var(--text); min-width: 80px; }
.searchbox input::placeholder { color: var(--faint); }

/* 项目多选下拉 */
.popover {
  position: absolute; z-index: 60; min-width: 260px; max-width: 340px;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow-lg);
  padding: 8px; animation: pop .13s ease-out;
}
@keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(.985); } to { opacity: 1; transform: none; } }
.popover .pop-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 3px 6px 8px; color: var(--muted); font-size: 11.5px;
  border-bottom: 1px solid var(--border); margin-bottom: 5px;
}
.popover .pop-head .links { display: flex; gap: 10px; }
.popover .pop-head button { border: 0; background: none; color: var(--primary); font-size: 11.5px; padding: 0; }
.popover .pop-head button:hover { text-decoration: underline; }
.proj-item {
  display: flex; align-items: center; gap: 9px;
  padding: 7px 8px; border-radius: var(--radius-xs); cursor: pointer;
  transition: background .12s;
}
.proj-item:hover { background: var(--panel-2); }
.proj-item input { accent-color: var(--primary); width: 14px; height: 14px; pointer-events: none; }
.proj-item .p-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.proj-item .p-name { font-weight: 550; font-size: 12.5px; }
.proj-item .p-meta { margin-left: auto; color: var(--faint); font-size: 11px; }

/* --------------------------------------------------------------------------
   严重级别标签 / 计数
   -------------------------------------------------------------------------- */
.sev-chip {
  display: inline-flex; align-items: center; gap: 7px;
  height: 30px; padding: 0 11px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--muted);
  font-size: 12.5px; font-weight: 550;
  transition: all .15s;
  user-select: none;
}
.sev-chip .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; opacity: .9; }
.sev-chip .n {
  min-width: 20px; height: 18px; padding: 0 5px; border-radius: 9px;
  background: var(--panel-3); color: var(--text-2);
  font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;
}
.sev-chip:hover { border-color: var(--border-strong); }
.sev-chip.on { color: var(--text); border-color: var(--border-strong); box-shadow: var(--shadow-sm); }
.sev-chip.on[data-sev="CRITICAL"] { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 40%, transparent); background: var(--crit-soft); }
.sev-chip.on[data-sev="HIGH"] { color: var(--high); border-color: color-mix(in srgb, var(--high) 40%, transparent); background: var(--high-soft); }
.sev-chip.on[data-sev="MEDIUM"] { color: var(--med); border-color: color-mix(in srgb, var(--med) 42%, transparent); background: var(--med-soft); }
.sev-chip.on[data-sev="LOW"] { color: var(--low); border-color: color-mix(in srgb, var(--low) 42%, transparent); background: var(--low-soft); }
.sev-chip.on[data-sev="INFO"] { color: var(--info); border-color: var(--border-strong); background: var(--info-soft); }
.sev-chip.on[data-sev="CRITICAL"] .n { background: var(--crit); color: #fff; }
.sev-chip.on[data-sev="HIGH"] .n { background: var(--high); color: #fff; }
.sev-chip.on[data-sev="MEDIUM"] .n { background: var(--med); color: #fff; }
.sev-chip.on[data-sev="LOW"] .n { background: var(--low); color: #fff; }
.sev-chip.on[data-sev="INFO"] .n { background: var(--info); color: #fff; }
.sev-chip.off { opacity: .52; }
.sev-chip.off .n { background: var(--panel-3); color: var(--faint); }

/* KPI 卡片（Demo 2 使用） */
.kpi-card {
  flex: 1; min-width: 0; position: relative; overflow: hidden;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px 14px 11px;
  cursor: pointer; transition: border-color .15s, box-shadow .15s, transform .1s;
  text-align: left;
}
.kpi-card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-sm); }
.kpi-card.on { box-shadow: inset 0 0 0 1px currentColor; }
.kpi-card .kpi-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 11.5px; font-weight: 550; }
.kpi-card .kpi-top .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.kpi-card .kpi-n { font-size: 25px; font-weight: 750; letter-spacing: -.5px; margin-top: 2px; line-height: 1.15; }
.kpi-card .kpi-sub { color: var(--faint); font-size: 11px; margin-top: 1px; }
.kpi-card.off { opacity: .48; }
.kpi-card[data-sev="CRITICAL"] { color: var(--crit); }
.kpi-card[data-sev="HIGH"] { color: var(--high); }
.kpi-card[data-sev="MEDIUM"] { color: var(--med); }
.kpi-card[data-sev="LOW"] { color: var(--low); }
.kpi-card[data-sev="INFO"] { color: var(--info); }
.kpi-card .kpi-n, .kpi-card .kpi-sub { color: var(--text); }
.kpi-card .kpi-sub { color: var(--faint); }

/* --------------------------------------------------------------------------
   连接状态
   -------------------------------------------------------------------------- */
.conn-pill {
  display: inline-flex; align-items: center; gap: 7px;
  height: 30px; padding: 0 11px; border-radius: 999px;
  background: var(--ok-soft); color: var(--ok);
  font-size: 12px; font-weight: 600; border: 1px solid transparent;
  white-space: nowrap;
}
.conn-pill .pulse { width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 0 currentColor; animation: pulse 2.2s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 currentColor; opacity: 1; } 70% { box-shadow: 0 0 0 6px transparent; opacity: .85; } 100% { box-shadow: 0 0 0 0 transparent; opacity: 1; } }
.conn-pill.offline { background: var(--high-soft); color: var(--high); }
.conn-pill .who { color: var(--muted); font-weight: 500; }

/* --------------------------------------------------------------------------
   结果表格
   -------------------------------------------------------------------------- */
.table-wrap { position: relative; height: 100%; min-height: 0; overflow: auto; background: var(--panel); border-radius: var(--radius); border: 1px solid var(--border); }
table.results { width: 100%; border-collapse: separate; border-spacing: 0; }
table.results thead th {
  position: sticky; top: 0; z-index: 5;
  background: var(--panel-2);
  color: var(--muted); font-size: 11.5px; font-weight: 650;
  text-align: left; padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap; letter-spacing: .2px;
}
table.results thead th.sortable { cursor: pointer; user-select: none; }
table.results thead th.sortable:hover { color: var(--text); }
table.results thead th .arrow { color: var(--primary); font-size: 9px; margin-left: 3px; }
table.results tbody td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
table.results tbody tr { cursor: pointer; transition: background .1s; }
table.results tbody tr:hover { background: var(--panel-2); }
table.results tbody tr.selected { background: var(--primary-soft); }
table.results tbody tr.selected td:first-child { box-shadow: inset 3px 0 0 var(--primary); }
table.results tbody tr:last-child td { border-bottom: 0; }
.vuln-name { font-weight: 600; font-size: 13px; color: var(--text); }
.vuln-sub { color: var(--faint); font-size: 11.5px; margin-top: 1px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.file-cell { font-family: var(--mono); font-size: 11.5px; color: var(--text-2); max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-cell i { font-style: normal; color: var(--faint); }
.sev-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }

.pill {
  display: inline-flex; align-items: center; gap: 4px;
  height: 22px; padding: 0 8px; border-radius: 6px;
  font-size: 11px; font-weight: 650; letter-spacing: .2px;
  white-space: nowrap;
}
.pill.sev-CRITICAL { background: var(--crit-soft); color: var(--crit); }
.pill.sev-HIGH { background: var(--high-soft); color: var(--high); }
.pill.sev-MEDIUM { background: var(--med-soft); color: var(--med); }
.pill.sev-LOW { background: var(--low-soft); color: var(--low); }
.pill.sev-INFO { background: var(--info-soft); color: var(--info); }
.pill.state { background: var(--panel-3); color: var(--text-2); font-weight: 550; }
.pill.state.st-TO_VERIFY { background: var(--med-soft); color: var(--med); }
.pill.state.st-CONFIRMED { background: var(--high-soft); color: var(--high); }
.pill.state.st-IGNORED { background: var(--info-soft); color: var(--info); }
.pill.status { background: transparent; border: 1px solid var(--border); color: var(--muted); font-weight: 550; }
.pill.status.st-NEW { color: var(--primary); border-color: color-mix(in srgb, var(--primary) 35%, transparent); background: var(--primary-soft); }
.pill.status.st-RECURRENT { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 35%, transparent); background: var(--med-soft); }

/* 空状态 */
.empty-state {
  height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px; color: var(--muted); text-align: center; padding: 30px;
}
.empty-state .big { font-size: 30px; opacity: .5; }
.empty-state h3 { margin: 0; font-size: 14px; color: var(--text-2); font-weight: 600; }
.empty-state p { margin: 0; font-size: 12.5px; color: var(--faint); max-width: 420px; }

/* --------------------------------------------------------------------------
   详情内容（抽屉 / 固定面板 / 弹窗共用）
   -------------------------------------------------------------------------- */
.detail-content { padding: 0; }
.dt-head { padding: 18px 20px 14px; border-bottom: 1px solid var(--border); }
.dt-title-row { display: flex; align-items: flex-start; gap: 10px; justify-content: space-between; }
.dt-title { font-size: 17px; font-weight: 700; letter-spacing: -.2px; line-height: 1.35; }
.dt-sub { color: var(--muted); font-size: 12px; margin-top: 3px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.dt-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.dt-actions-top { display: flex; align-items: center; gap: 4px; flex: none; }

.dt-meta { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--border); border-bottom: 1px solid var(--border); }
.dt-meta .m { background: var(--panel-2); padding: 9px 14px; min-width: 0; }
.dt-meta .m .k { color: var(--faint); font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px; }
.dt-meta .m .v { font-size: 12.5px; font-weight: 550; color: var(--text-2); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dt-meta .m .v.mono { font-weight: 500; }

.dt-body { padding: 4px 20px 22px; }
.dt-sec { padding: 14px 0 2px; border-bottom: 1px dashed var(--border); }
.dt-sec:last-of-type { border-bottom: 0; }
.dt-sec h4 {
  margin: 0 0 8px; font-size: 12px; font-weight: 700; color: var(--text-2);
  display: flex; align-items: center; gap: 7px; letter-spacing: .2px;
}
.dt-sec h4 .en { color: var(--faint); font-weight: 500; font-size: 10.5px; letter-spacing: .4px; text-transform: uppercase; }
.dt-sec h4 .count { margin-left: auto; color: var(--faint); font-weight: 500; font-size: 11px; }
.dt-sec p { margin: 0 0 8px; color: var(--text-2); font-size: 12.8px; line-height: 1.7; }
.dt-sec .hint { color: var(--faint); font-size: 11.5px; }

/* 攻击向量 payload */
.payload {
  margin: 8px 0 4px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--bg-soft); overflow: hidden;
}
.payload .p-head { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; border-bottom: 1px solid var(--border); color: var(--faint); font-size: 10.5px; letter-spacing: .4px; text-transform: uppercase; }
.payload pre { margin: 0; padding: 10px 12px; overflow-x: auto; font-family: var(--mono); font-size: 11.5px; line-height: 1.6; color: var(--text-2); }

/* 数据流 */
.flow { list-style: none; margin: 4px 0 4px; padding: 0; position: relative; }
.flow-step { position: relative; padding: 0 0 12px 24px; }
.flow-step::before {
  content: ""; position: absolute; left: 7px; top: 17px; bottom: -2px; width: 2px;
  background: linear-gradient(var(--border-strong), var(--border));
}
.flow-step:last-child::before { display: none; }
.flow-step .node {
  position: absolute; left: 0; top: 2px; width: 16px; height: 16px; border-radius: 50%;
  background: var(--panel); border: 2px solid var(--border-strong);
  font-size: 9px; font-weight: 700; color: var(--muted);
  display: flex; align-items: center; justify-content: center;
}
.flow-step[data-label="source"] .node { border-color: var(--primary); color: var(--primary); }
.flow-step[data-label="sink"] .node { border-color: var(--high); color: var(--high); }
.flow-step .fl-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.flow-step .fl-file { font-family: var(--mono); font-size: 11.5px; font-weight: 600; color: var(--text); }
.flow-step .fl-line { color: var(--faint); font-size: 11px; }
.flow-step .fl-tag { font-size: 9.5px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; background: var(--panel-3); color: var(--muted); }
.flow-step[data-label="source"] .fl-tag { background: var(--primary-soft); color: var(--primary); }
.flow-step[data-label="sink"] .fl-tag { background: var(--high-soft); color: var(--high); }
.flow-step code { display: block; margin-top: 4px; background: var(--bg-soft); border: 1px solid var(--border); border-radius: 6px; padding: 6px 9px; font-family: var(--mono); font-size: 11px; color: var(--text-2); overflow-x: auto; white-space: pre; }

/* 代码块 / Bad & Good */
.cmp { display: grid; grid-template-columns: 1fr; gap: 10px; }
.cmp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.code-card { border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; background: var(--bg-soft); }
.code-card .c-head { display: flex; align-items: center; gap: 7px; padding: 6px 10px; border-bottom: 1px solid var(--border); font-size: 11px; font-weight: 650; }
.code-card .c-head .lang { margin-left: auto; color: var(--faint); font-weight: 500; font-size: 10px; text-transform: uppercase; letter-spacing: .4px; }
.code-card .c-head .t { display: inline-flex; align-items: center; gap: 5px; }
.code-card.bad .c-head { color: var(--high); background: var(--high-soft); }
.code-card.good .c-head { color: var(--ok); background: var(--ok-soft); }
.code-card pre { margin: 0; padding: 10px 12px; overflow-x: auto; font-family: var(--mono); font-size: 11px; line-height: 1.62; color: var(--text-2); }
.code-card pre .tok-k { color: #7c3aed; }
body[data-theme="dark"] .code-card pre .tok-k { color: #c4b5fd; }
.code-tabs { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius-xs); overflow: hidden; margin: 2px 0 8px; }
.code-tabs button { border: 0; background: var(--panel); color: var(--muted); font-size: 11px; padding: 4px 10px; }
.code-tabs button.on { background: var(--primary-soft); color: var(--primary); font-weight: 650; }
.code-tabs button + button { border-left: 1px solid var(--border); }

/* 参考链接 */
.refs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.refs a {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 8px; margin: 0 -8px; border-radius: var(--radius-xs);
  color: var(--text-2); font-size: 12.5px;
}
.refs a:hover { background: var(--panel-2); text-decoration: none; color: var(--primary); }
.refs .ico { color: var(--faint); font-size: 12px; }
.refs .ext { margin-left: auto; color: var(--faint); font-size: 10px; }

/* 详情底部操作 */
.dt-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 14px 20px 18px; border-top: 1px solid var(--border); background: var(--panel-2); position: sticky; bottom: 0; }
.dt-foot .spacer { flex: 1; }
.dt-foot .note { color: var(--faint); font-size: 11px; }

/* 详情导航（上一个/下一个） */
.detail-nav { display: flex; align-items: center; gap: 4px; }
.detail-nav .pos { color: var(--faint); font-size: 11px; padding: 0 4px; min-width: 42px; text-align: center; }
.detail-nav .icon-btn { width: 28px; height: 28px; font-size: 13px; }

/* --------------------------------------------------------------------------
   右侧抽屉
   -------------------------------------------------------------------------- */
.detail-backdrop {
  position: fixed; inset: 0; background: rgba(8, 15, 30, .42);
  backdrop-filter: blur(1.5px); z-index: 80;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.detail-backdrop.open { opacity: 1; pointer-events: auto; }
.detail-drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: 500px; max-width: 92vw;
  background: var(--panel); border-left: 1px solid var(--border);
  box-shadow: var(--shadow-lg); z-index: 82;
  transform: translateX(102%); transition: transform .24s cubic-bezier(.22, .8, .26, 1);
  display: flex; flex-direction: column; overflow: hidden;
}
.detail-drawer.open { transform: none; }
.drawer-top {
  display: flex; align-items: center; gap: 6px; justify-content: space-between;
  padding: 8px 12px; border-bottom: 1px solid var(--border); flex: none;
  background: var(--panel-2);
}
.detail-drawer .drawer-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; min-height: 0; }
.detail-drawer .drawer-scroll .dt-foot { position: sticky; bottom: 0; }

/* 详情内容不允许把容器撑出横向滚动条（代码块内部仍可横向滚动以保留代码格式） */
.detail-modal-scroll { overflow-x: hidden; }
.detail-content, .dt-head, .dt-meta, .dt-body, .dt-sec, .dt-foot { min-width: 0; max-width: 100%; }
.dt-title-row > div { min-width: 0; }
.dt-title, .dt-sub span, .dt-sec p, .dt-sec h4, .refs a span, .fl-file, .badge-soft {
  overflow-wrap: anywhere; word-break: break-word;
}
.refs a { min-width: 0; }
.cmp, .cmp-grid { min-width: 0; }
.cmp-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.cmp-grid > *, .code-card { min-width: 0; max-width: 100%; }
.payload { max-width: 100%; }
.payload pre, .code-card pre, .flow-step code { max-width: 100%; }

/* --------------------------------------------------------------------------
   固定检查器（Demo 2 右侧面板）
   -------------------------------------------------------------------------- */
.inspector-panel {
  height: 100%; min-height: 0; display: flex; flex-direction: column;
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
  overflow: hidden;
}
.inspector-panel .insp-top {
  display: flex; align-items: center; gap: 8px; justify-content: space-between;
  padding: 9px 12px; border-bottom: 1px solid var(--border); flex: none; background: var(--panel-2);
  color: var(--muted); font-size: 11.5px; font-weight: 650; letter-spacing: .3px; text-transform: uppercase;
}
.inspector-panel .insp-scroll { flex: 1; overflow-y: auto; min-height: 0; }
.inspector-empty { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 30px; color: var(--faint); }
.inspector-empty .big { font-size: 34px; opacity: .45; }
.inspector-empty h3 { margin: 0; font-size: 13.5px; color: var(--text-2); font-weight: 600; }
.inspector-empty p { margin: 0; font-size: 12px; max-width: 260px; line-height: 1.7; }

/* --------------------------------------------------------------------------
   弹窗（通用）
   -------------------------------------------------------------------------- */
.modal-layer {
  position: fixed; inset: 0; z-index: 90;
  display: flex; align-items: center; justify-content: center; padding: 28px;
  background: rgba(8, 15, 30, .5); backdrop-filter: blur(4px);
  opacity: 0; pointer-events: none; transition: opacity .18s;
}
.modal-layer.open { opacity: 1; pointer-events: auto; }
.modal {
  width: 560px; max-width: 96vw; max-height: 90vh;
  display: flex; flex-direction: column;
  background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
  box-shadow: var(--shadow-lg);
  transform: translateY(10px) scale(.985); transition: transform .2s cubic-bezier(.22, .8, .26, 1);
  overflow: hidden;
}
.modal-layer.open .modal { transform: none; }
.modal-head {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 16px 18px 13px; border-bottom: 1px solid var(--border); flex: none;
}
.modal-head .m-title { font-size: 15px; font-weight: 700; letter-spacing: -.2px; }
.modal-head .m-sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
.modal-head .close { margin-left: auto; flex: none; }
.modal-body { padding: 16px 18px; overflow-y: auto; min-height: 0; }
.modal-foot {
  display: flex; align-items: center; gap: 8px; justify-content: flex-end;
  padding: 12px 18px; border-top: 1px solid var(--border); background: var(--panel-2); flex: none;
}
.modal-foot .spacer { flex: 1; }
.modal-foot .tip { color: var(--faint); font-size: 11.5px; }

/* 详情弹窗（Demo 3 使用） */
.detail-modal-layer .modal { width: 980px; max-width: 96vw; }
.detail-modal-layer .detail-content { padding: 0; }
.detail-modal-layer .dt-head { padding-top: 16px; }
.detail-modal-layer .dt-body { padding-bottom: 10px; }
.detail-modal-scroll { overflow-y: auto; min-height: 0; }

/* --------------------------------------------------------------------------
   登录遮罩
   -------------------------------------------------------------------------- */
.login-overlay {
  position: fixed; inset: 0; z-index: 120;
  display: flex; align-items: center; justify-content: center; padding: 30px;
  background:
    radial-gradient(1200px 620px at 12% -10%, rgba(37, 99, 235, .18), transparent 60%),
    radial-gradient(1000px 620px at 100% 110%, rgba(14, 165, 233, .14), transparent 55%),
    linear-gradient(160deg, #f7f9fd 0%, #e9eef7 55%, #e3eaf6 100%);
  transition: opacity .28s;
}
.login-overlay::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background-image: linear-gradient(rgba(100, 116, 139, .07) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(100, 116, 139, .07) 1px, transparent 1px);
  background-size: 34px 34px;
  mask-image: radial-gradient(900px 600px at 50% 40%, #000 30%, transparent 75%);
}
.login-overlay.closing { opacity: 0; }
.login-card {
  position: relative; width: 460px; max-width: 94vw;
  background: rgba(255, 255, 255, .92); backdrop-filter: blur(14px);
  border: 1px solid rgba(148, 163, 184, .35); border-radius: 18px;
  box-shadow: 0 30px 90px rgba(15, 23, 42, .18);
  padding: 28px 30px 24px;
}
.login-brand { display: flex; align-items: center; gap: 9px; margin-bottom: 22px; }
.login-brand .logo { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, #2563eb, #06b6d4); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 15px; box-shadow: 0 6px 16px rgba(37, 99, 235, .35); }
.login-brand .bn { font-weight: 750; font-size: 14.5px; letter-spacing: -.2px; }
.login-brand .bs { color: var(--faint); font-size: 11px; border-left: 1px solid var(--border-strong); padding-left: 8px; }
.login-card h1 { margin: 0 0 5px; font-size: 21px; letter-spacing: -.6px; }
.login-card .lead { margin: 0 0 20px; color: var(--muted); font-size: 12.5px; line-height: 1.65; }
.login-card label.fl { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--text-2); font-weight: 600; margin-bottom: 6px; }
.login-card label.fl a { font-weight: 500; font-size: 11.5px; }
.login-card textarea {
  width: 100%; height: 88px; resize: none;
  border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
  background: #fff; padding: 10px 12px;
  font-family: var(--mono); font-size: 12px; line-height: 1.6; color: var(--text);
  transition: border-color .15s, box-shadow .15s;
}
.login-card textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-ring); }
.login-card textarea::placeholder { font-family: var(--font); color: var(--faint); }
.login-row { display: flex; align-items: center; gap: 10px; margin-top: 16px; }
.login-row .btn.primary { height: 40px; flex: 1; font-size: 14px; border-radius: var(--radius-sm); }
.login-error { min-height: 18px; color: var(--high); font-size: 12px; margin-top: 8px; }
.login-hint { margin-top: 12px; padding: 9px 11px; border-radius: var(--radius-sm); background: rgba(37, 99, 235, .06); border: 1px dashed rgba(37, 99, 235, .28); color: var(--muted); font-size: 11.5px; line-height: 1.6; }
.login-hint b { color: var(--primary); font-weight: 650; }
.login-foot { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 16px; color: var(--faint); font-size: 11px; }

/* 深色主题登录 */
body[data-theme="dark"] .login-overlay {
  background:
    radial-gradient(1100px 600px at 15% -5%, rgba(59, 130, 246, .22), transparent 60%),
    radial-gradient(1000px 640px at 100% 110%, rgba(6, 182, 212, .16), transparent 55%),
    linear-gradient(160deg, #060b16 0%, #08101f 60%, #060b16 100%);
}
body[data-theme="dark"] .login-overlay::before {
  background-image: linear-gradient(rgba(148, 163, 184, .08) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(148, 163, 184, .08) 1px, transparent 1px);
}
body[data-theme="dark"] .login-card { background: rgba(14, 24, 48, .86); border-color: rgba(59, 130, 246, .22); }
body[data-theme="dark"] .login-brand .bs { border-color: var(--border); }
body[data-theme="dark"] .login-card textarea { background: rgba(6, 11, 22, .6); }
body[data-theme="dark"] .login-hint { background: rgba(59, 130, 246, .09); border-color: rgba(59, 130, 246, .3); }

/* --------------------------------------------------------------------------
   设置弹窗
   -------------------------------------------------------------------------- */
.settings-block { border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; background: var(--panel-2); }
.settings-block + .settings-block { margin-top: 12px; }
.settings-block .sb-title { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 700; color: var(--text-2); margin-bottom: 10px; }
.settings-block .sb-title .en { color: var(--faint); font-size: 10px; letter-spacing: .5px; text-transform: uppercase; font-weight: 500; }
.field { margin-bottom: 10px; }
.field:last-child { margin-bottom: 0; }
.field > label { display: flex; align-items: center; justify-content: space-between; font-size: 11.5px; color: var(--muted); font-weight: 600; margin-bottom: 5px; }
.field input[type="text"], .field input[type="password"], .field select, .field textarea {
  width: 100%; height: 34px; padding: 0 10px;
  border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
  background: var(--panel); color: var(--text); font-size: 12.5px;
}
.field textarea { height: 64px; padding: 8px 10px; resize: none; font-family: var(--mono); font-size: 11.5px; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-ring); }
.secret-wrap { position: relative; }
.secret-wrap input { padding-right: 40px; }
.secret-wrap .eye { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); }
.parse-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.parse-grid .pg { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-xs); padding: 7px 10px; }
.parse-grid .pg .k { color: var(--faint); font-size: 10px; letter-spacing: .4px; text-transform: uppercase; }
.parse-grid .pg .v { font-size: 12px; font-weight: 600; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.settings-foot { display: flex; gap: 8px; align-items: center; margin-top: 14px; }
.settings-foot .spacer { flex: 1; }

/* --------------------------------------------------------------------------
   本地扫描弹窗
   -------------------------------------------------------------------------- */
.scan-lead { color: var(--muted); font-size: 12.5px; line-height: 1.65; margin: 0 0 12px; }
.scan-callout { display: flex; gap: 9px; align-items: flex-start; padding: 9px 11px; border-radius: var(--radius-sm); background: var(--primary-soft); color: var(--text-2); font-size: 11.8px; line-height: 1.6; margin-bottom: 14px; }
.scan-callout .i { color: var(--primary); font-weight: 700; }
.scan-folders { display: flex; flex-direction: column; gap: 8px; }
.scan-folder-row {
  display: grid; grid-template-columns: 22px minmax(0, 1.6fr) minmax(0, .9fr) 28px;
  gap: 8px; align-items: center;
  padding: 9px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--panel-2);
}
.scan-folder-row .idx { color: var(--faint); font-size: 11px; font-weight: 700; text-align: center; }
.scan-folder-row .path-wrap { position: relative; display: flex; align-items: center; gap: 6px; }
.scan-folder-row input {
  width: 100%; height: 30px; padding: 0 9px;
  border: 1px solid var(--border-strong); border-radius: var(--radius-xs);
  background: var(--panel); color: var(--text); font-size: 11.8px; font-family: var(--mono);
}
.scan-folder-row input.pname { font-family: var(--font); }
.scan-folder-row input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-ring); }
.scan-folder-row .browse { flex: none; height: 30px; padding: 0 8px; font-size: 11.5px; }
.scan-folder-row .remove { color: var(--faint); }
.scan-folder-row .remove:hover { color: var(--high); }
.scan-folder-labels { display: grid; grid-template-columns: 22px minmax(0, 1.6fr) minmax(0, .9fr) 28px; gap: 8px; padding: 0 9px; color: var(--faint); font-size: 10.5px; letter-spacing: .3px; margin-bottom: 5px; }
.scan-progress { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.scan-prog-row { display: grid; grid-template-columns: 180px minmax(0, 1fr) 92px; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--panel-2); font-size: 11.8px; }
.scan-prog-row .pname2 { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.scan-prog-row .bar { height: 6px; border-radius: 3px; background: var(--panel-3); overflow: hidden; }
.scan-prog-row .bar > i { display: block; height: 100%; width: 0; border-radius: 3px; background: linear-gradient(90deg, var(--primary), #06b6d4); transition: width .35s ease; }
.scan-prog-row .st { color: var(--muted); font-size: 11px; text-align: right; white-space: nowrap; }
.scan-prog-row.done .st { color: var(--ok); font-weight: 600; }
.scan-prog-row.done .bar > i { background: var(--ok); }
.scan-options { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-top: 14px; padding-top: 13px; border-top: 1px dashed var(--border); }
.scan-options .opt { display: flex; align-items: center; gap: 7px; color: var(--text-2); font-size: 12px; }
.scan-options input[type="checkbox"] { accent-color: var(--primary); width: 14px; height: 14px; }
.scan-options input[type="text"] { height: 30px; padding: 0 8px; border: 1px solid var(--border-strong); border-radius: var(--radius-xs); background: var(--panel); color: var(--text); font-size: 12px; width: 130px; }
.scan-summary { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; padding: 10px 12px; border-radius: var(--radius-sm); background: var(--ok-soft); color: var(--ok); font-size: 12.5px; font-weight: 600; }
.scan-summary .sub { color: var(--muted); font-weight: 500; }

/* --------------------------------------------------------------------------
   Toast
   -------------------------------------------------------------------------- */
.toast-stack { position: fixed; right: 20px; bottom: 20px; z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }
.toast {
  display: flex; align-items: center; gap: 9px;
  padding: 9px 13px; border-radius: var(--radius-sm);
  background: var(--panel); color: var(--text-2);
  border: 1px solid var(--border); box-shadow: var(--shadow);
  font-size: 12.5px; max-width: 420px;
  animation: toastIn .18s ease-out;
  pointer-events: auto;
}
.toast.ok { border-left: 3px solid var(--ok); }
.toast.err { border-left: 3px solid var(--high); }
.toast.info { border-left: 3px solid var(--primary); }
.toast.leaving { animation: toastOut .2s forwards; }
@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes toastOut { to { opacity: 0; transform: translateY(6px); } }

/* --------------------------------------------------------------------------
   通用工具
   -------------------------------------------------------------------------- */
.divider { height: 1px; background: var(--border); margin: 10px 0; }
.badge-soft { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 6px; background: var(--panel-3); color: var(--muted); font-size: 11px; }
.kbd { font-family: var(--mono); font-size: 10.5px; padding: 1px 5px; border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 4px; color: var(--muted); background: var(--panel); }
[data-conn] { transition: opacity .2s; }

/* ============================ Demo 1 布局 ============================ */
body {
  background: linear-gradient(180deg, #f4f7fb 0%, #edf1f7 55%, #e9eef6 100%);
}

#app { height: 100vh; display: flex; flex-direction: column; min-height: 0; }

/* 顶栏 */
.topbar {
  flex: none; height: 62px; display: flex; align-items: center; gap: 16px;
  padding: 0 20px; background: var(--panel);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 1px 0 rgba(15, 23, 42, .02), 0 8px 24px -22px rgba(15, 23, 42, .35);
  position: relative; z-index: 30;
}
.brand { display: flex; align-items: center; gap: 10px; flex: none; }
.brand .logo {
  width: 31px; height: 31px; border-radius: 9px;
  background: linear-gradient(135deg, #2563eb, #06b6d4);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 800; font-size: 12.5px; letter-spacing: -.5px;
  box-shadow: 0 5px 14px rgba(37, 99, 235, .32);
}
.brand .name { font-size: 14.5px; font-weight: 750; letter-spacing: -.25px; line-height: 1.15; }
.brand .sub { font-size: 10.5px; color: var(--faint); letter-spacing: .2px; }
.demo-badge {
  margin-left: 4px; flex: none;
  font-size: 10px; font-weight: 700; letter-spacing: .7px;
  color: var(--primary); background: var(--primary-soft);
  border: 1px solid color-mix(in srgb, var(--primary) 25%, transparent);
  padding: 3px 8px; border-radius: 999px; white-space: nowrap;
}
.back-link { color: var(--faint); font-size: 11.5px; margin-left: 2px; white-space: nowrap; }
.back-link:hover { color: var(--primary); }

/* 顶栏筛选（项目 / 分支 / 扫描时间 同一排） */
.filter-row { display: flex; align-items: center; gap: 9px; flex: 1; min-width: 0; padding-left: 6px; }
.picker-wrap { position: relative; flex: none; }
#projectMenu { top: calc(100% + 7px); left: 0; }
.topbar-actions { display: flex; align-items: center; gap: 8px; flex: none; }

/* 看板工具条 */
.board-toolbar {
  flex: none; display: flex; align-items: center; justify-content: space-between;
  gap: 14px; padding: 12px 20px 11px; flex-wrap: wrap;
}
.sev-chips { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.sev-chips .divider-v { width: 1px; height: 20px; background: var(--border-strong); margin: 0 4px; opacity: .7; }
.total-chip { color: var(--muted); font-size: 12px; margin-left: 2px; }
.total-chip b { color: var(--text); font-weight: 750; }
.toolbar-right { display: flex; align-items: center; gap: 8px; }
.count { color: var(--faint); font-size: 12px; padding: 0 4px; }

/* 看板主体：占满剩余高度，仅表格内部滚动 */
.board { flex: 1; min-height: 0; padding: 0 20px 18px; display: flex; }
.board .table-wrap { flex: 1; box-shadow: 0 10px 30px -26px rgba(15, 23, 42, .5); }

table.results thead th { padding-top: 11px; padding-bottom: 11px; }
table.results tbody tr { height: 50px; }

/* 筛选为空时的提示 */
.empty-row .empty-state { height: 300px !important; }

@media (max-width: 1280px) {
  .brand .sub, .back-link { display: none; }
  .searchbox { min-width: 170px; }
  .demo-badge { display: none; }
}
@media (max-width: 1024px) {
  .topbar { height: auto; flex-wrap: wrap; padding: 10px 14px; }
  .filter-row { order: 3; width: 100%; padding-left: 0; }
}

<div id="app">

  <header class="topbar">

        <select id="scanSelect"><option value="">最近一次扫描</option></select>

    <div class="topbar-actions">

      <button class="btn primary" id="localScanBtn" type="button">＋ 本地扫描</button>
      <button class="icon-btn" id="settingsBtn" type="button" title="连接设置">⚙</button>
    </div>
  </header>

  <!-- ======================= 严重级别筛选 + 搜索 ======================= -->
  <section class="board-toolbar">
    <div class="sev-chips" id="sevChips">
      <button class="sev-chip on" data-sev="CRITICAL" type="button"><span class="dot"></span>Critical <span class="n" data-count>0</span></button>
      <button class="sev-chip on" data-sev="HIGH" type="button"><span class="dot"></span>High <span class="n" data-count>0</span></button>
      <button class="sev-chip on" data-sev="MEDIUM" type="button"><span class="dot"></span>Medium <span class="n" data-count>0</span></button>
      <button class="sev-chip on" data-sev="LOW" type="button"><span class="dot"></span>Low <span class="n" data-count>0</span></button>
      <button class="sev-chip on" data-sev="INFO" type="button"><span class="dot"></span>Info <span class="n" data-count>0</span></button>
      <span class="divider-v"></span>
      <span class="total-chip">当前共 <b id="totalCount">0</b> 个漏洞</span>
    </div>
    <div class="toolbar-right">
      <label class="searchbox">🔍<input id="searchInput" type="text" placeholder="搜索漏洞 / 文件 / CWE / 描述…" /></label>
      <span class="count" id="resultCount"></span>
      <button class="btn ghost" id="resetFiltersBtn" type="button">重置</button>
      <button class="btn ghost" id="exportBtn" type="button">导出 CSV</button>
    </div>
  </section>

  <!-- ======================= 结果表格（内部滚动） ======================= -->
  <main class="board">
    <div class="table-wrap">
      <table class="results">
        <thead id="resultsHead"></thead>
        <tbody id="resultsBody"></tbody>
      </table>
    </div>
  </main>
</div>

    { key: 'project', label: '项目' },
    { key: 'file', label: '文件 / 行' },
    { key: 'state', label: '状态' },
    { key: 'found', label: '发现时间', width: '110px' }
  ];

  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function pad(n) { return n < 10 ? '0' + n : String(n); }
  function fmtDate(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    if (isNaN(d)) return String(iso);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function relTime(iso) {
    if (!iso) return '—';
    var t = new Date(iso).getTime();
    if (isNaN(t)) return '—';
    var diff = Math.max(0, DEMO_NOW - t);
    var min = Math.round(diff / 60000);
    if (min < 1) return '刚刚';
    if (min < 60) return min + ' 分钟前';
    var h = Math.round(min / 60);
    if (h < 24) return h + ' 小时前';
    var d = Math.round(h / 24);
    if (d < 30) return d + ' 天前';
    return fmtDate(iso).slice(0, 10);
  }
  function sevRank(s) { return SEV_ORDER[s] == null ? 9 : SEV_ORDER[s]; }
  function isWideDetail() { return CFG.detailMode === 'modal'; }

  /* ----------------------------------------------------------------------
     索引
     ---------------------------------------------------------------------- */
  var projectById = {}, scanById = {};
  function reindex() {
    projectById = {};
    scanById = {};
    MOCK.projects.forEach(function (p) { projectById[p.id] = p; });
    MOCK.scans.forEach(function (s) { scanById[s.id] = s; });
  }
  reindex();

  function projectName(id) { return (projectById[id] || {}).name || '—'; }
  function projectColor(id) { return (projectById[id] || {}).color || '#64748b'; }
  function scanOf(f) { return scanById[f.scanId] || {}; }
  function branchOf(f) { return scanOf(f).branch || '—'; }
  function scanTimeOf(f) { return fmtDate(scanOf(f).createdAt); }

  /* ----------------------------------------------------------------------
     状态
     ---------------------------------------------------------------------- */
  var ALL_SEVS = ['CRITICAL', 'HIGH', 'MEDIUM', 'LOW', 'INFO'];
  var state = {
    loggedIn: false,
    projects: new Set(CFG.defaultProjects || MOCK.projects.map(function (p) { return p.id; })),
    branch: '',
    scanId: '',
    sevs: new Set(ALL_SEVS),
    q: '',
    sort: { key: 'severity', dir: 1 },
    selectedId: null,
    rows: [],
    localProjects: []
  };

  /* ----------------------------------------------------------------------
     Toast
     ---------------------------------------------------------------------- */
  function toast(msg, type, ms) {
    var stack = $('#toastStack');
    if (!stack) {
      stack = document.createElement('div');
      stack.className = 'toast-stack';
      stack.id = 'toastStack';
      document.body.appendChild(stack);
    }
    var el = document.createElement('div');
    el.className = 'toast ' + (type || 'info');
    el.innerHTML = (type === 'ok' ? '✓ ' : type === 'err' ? '⚠ ' : 'ℹ️ ') + esc(msg);
    stack.appendChild(el);
    setTimeout(function () {
      el.classList.add('leaving');
      setTimeout(function () { el.remove(); }, 220);
    }, ms || 2600);
  }

  /* ----------------------------------------------------------------------
     数据查询
     ---------------------------------------------------------------------- */
  function ctxFindings() {
    return MOCK.findings.filter(function (f) {
      if (!state.projects.has(f.projectId)) return false;
      if (state.branch && branchOf(f) !== state.branch) return false;
      if (state.scanId && f.scanId !== state.scanId) return false;
      return true;
    });
  }
  function withSearch(list) {
    var q = state.q.trim().toLowerCase();
    if (!q) return list;
    return list.filter(function (f) {
      var hay = [f.queryName, f.cweName, f.file, 'cwe-' + f.cwe, f.groupName, f.language, f.description, projectName(f.projectId)].join(' ').toLowerCase();
      return hay.indexOf(q) >= 0;
    });
  }
  function currentRows() {
    var list = withSearch(ctxFindings()).filter(function (f) { return state.sevs.has(f.severity); });
    list.sort(function (a, b) {
      var va, vb, dir = state.sort.dir;
      if (state.sort.key === 'severity') { va = sevRank(a.severity); vb = sevRank(b.severity); }
      else if (state.sort.key === 'found') { va = a.foundAt; vb = b.foundAt; }
      else if (state.sort.key === 'query') { va = a.queryName; vb = b.queryName; }
      else if (state.sort.key === 'project') { va = projectName(a.projectId); vb = projectName(b.projectId); }
      else if (state.sort.key === 'file') { va = a.file; vb = b.file; }
      else if (state.sort.key === 'state') { va = a.state; vb = b.state; }
      else { va = a.id; vb = b.id; }
      if (va < vb) return -1 * dir;
      if (va > vb) return 1 * dir;
      return 0;
    });
    return list;
  }
  function findingById(id) {
    for (var i = 0; i < MOCK.findings.length; i++) if (MOCK.findings[i].id === id) return MOCK.findings[i];
    return null;
  }
  function branchesOfSelected() {
    var set = {};
    MOCK.scans.forEach(function (s) { if (state.projects.has(s.projectId)) set[s.branch] = 1; });
    return Object.keys(set).sort();
  }
  function scansOfSelected() {
    var list = MOCK.scans.filter(function (s) {
      if (!state.projects.has(s.projectId)) return false;
      if (state.branch && s.branch !== state.branch) return false;
      return true;
    });
    list.sort(function (a, b) { return new Date(b.createdAt) - new Date(a.createdAt); });
    return list;
  }
  function projectFindingCount(pid) {
    var n = 0;
    MOCK.findings.forEach(function (f) { if (f.projectId === pid) n++; });
    return n;
  }
  function projectRiskCount(pid) {
    var n = 0;
    MOCK.findings.forEach(function (f) {
      if (f.projectId === pid && (f.severity === 'CRITICAL' || f.severity === 'HIGH')) n++;
    });
    return n;
  }

  /* ----------------------------------------------------------------------
     多项目选择 UI
     ---------------------------------------------------------------------- */
  function projItemHtml(p) {
    return '<label class="proj-item" data-project="' + esc(p.id) + '">' +
      '<input type="checkbox" ' + (state.projects.has(p.id) ? 'checked' : '') + ' />' +
      '<span class="p-dot" style="background:' + esc(p.color || '#64748b') + '"></span>' +
      '<span class="p-name">' + esc(p.name) + '</span>' +
      '<span class="p-meta">' + projectFindingCount(p.id) + ' 项</span>' +
      '</label>';
  }

  function updateProjectUI() {
    var ids = MOCK.projects.map(function (p) { return p.id; });
    /* 顶部下拉按钮 */
    var btn = $('#projectPickerBtn');
    if (btn) {
      var labelEl = btn.querySelector('.val') || btn;
      var n = state.projects.size;
      var text;
      if (n === 0) text = '选择项目';
      else if (n === 1) text = projectName(Array.from(state.projects)[0]);
      else if (n === ids.length) text = '全部项目 (' + n + ')';
      else text = n + ' 个项目';
      if (labelEl !== btn) labelEl.textContent = text; else btn.textContent = text;
    }
    /* 下拉菜单 */
    var menu = $('#projectMenu');
    if (menu) {
      menu.innerHTML =
        '<div class="pop-head"><span>选择项目（可多选）</span>' +
        '<span class="links"><button type="button" data-proj-all>全选</button>' +
        '<button type="button" data-proj-none>清空</button></span></div>' +
        MOCK.projects.map(projItemHtml).join('');
    }
    /* 侧边栏项目列表 */
    var list = $('#projectList');
    if (list) list.innerHTML = MOCK.projects.map(projItemHtml).join('');
    /* 顶部项目 Tab（Demo 3） */
    var chips = $('#projectChips');
    if (chips) {
      chips.innerHTML = MOCK.projects.map(function (p) {
        var on = state.projects.has(p.id);
        return '<button type="button" class="proj-tab' + (on ? ' on' : '') + '" data-project-tab="' + esc(p.id) + '">' +
          '<span class="p-dot" style="background:' + esc(p.color || '#64748b') + '"></span>' +
          esc(p.name) +
          '<span class="p-n">' + projectRiskCount(p.id) + '</span></button>';
      }).join('');
    }
  }

  function setProjects(ids, silent) {
    if (!ids.length) { toast('至少需要选择一个项目', 'err'); return; }
    state.projects = new Set(ids);
    if (state.branch && branchesOfSelected().indexOf(state.branch) < 0) state.branch = '';
    if (state.scanId && !scanById[state.scanId]) state.scanId = '';
    updateProjectUI();
    renderFilterOptions();
    renderAll();
    if (!silent) toast('项目范围已更新：' + (ids.length === 1 ? projectName(ids[0]) : ids.length + ' 个项目'), 'info', 1600);
  }

  function toggleProject(id) {
    var ids = Array.from(state.projects);
    var idx = ids.indexOf(id);
    if (idx >= 0) {
      if (ids.length === 1) { toast('至少需要选择一个项目', 'err'); return; }
      ids.splice(idx, 1);
    } else {
      ids.push(id);
    }
    setProjects(ids, true);
  }

  function bindProjectUI() {
    var btn = $('#projectPickerBtn');
    var menu = $('#projectMenu');
    if (btn && menu) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        var open = menu.classList.toggle('open');
        menu.classList.toggle('hidden', !open);
      });
      menu.addEventListener('click', function (e) {
        e.stopPropagation();
        var all = e.target.closest('[data-proj-all]');
        var none = e.target.closest('[data-proj-none]');
        if (all) { setProjects(MOCK.projects.map(function (p) { return p.id; })); return; }
        if (none) { setProjects([MOCK.projects[0].id]); return; }
      });
      document.addEventListener('click', function () { menu.classList.add('hidden'); menu.classList.remove('open'); });
    }
    /* 任意项目勾选/切换（下拉、侧栏、Tab） */
    document.addEventListener('change', function (e) {
      var item = e.target.closest && e.target.closest('[data-project]');
      if (item && e.target.type === 'checkbox') {
        var id = item.getAttribute('data-project');
        var ids = Array.from(state.projects);
        if (e.target.checked) { ids.push(id); } else {
          if (ids.length === 1) { e.target.checked = true; toast('至少需要选择一个项目', 'err'); return; }
          ids = ids.filter(function (x) { return x !== id; });
        }
        setProjects(ids, true);
      }
    });
    document.addEventListener('click', function (e) {
      var tab = e.target.closest && e.target.closest('[data-project-tab]');
      if (tab) toggleProject(tab.getAttribute('data-project-tab'));
    });
  }

  /* ----------------------------------------------------------------------
     筛选栏（分支 / 扫描时间）
     ---------------------------------------------------------------------- */
  function renderFilterOptions() {
    var branchSel = $('#branchSelect');
    if (branchSel) {
      var branches = branchesOfSelected();
      branchSel.innerHTML = '<option value="">全部分支</option>' +
        branches.map(function (b) {
          return '<option value="' + esc(b) + '"' + (state.branch === b ? ' selected' : '') + '>' + esc(b) + '</option>';
        }).join('');
      branchSel.disabled = branches.length === 0;
    }
    var scanSel = $('#scanSelect');
    if (scanSel) {
      var scans = scansOfSelected();
      scanSel.innerHTML = '<option value="">最近一次扫描</option>' +
        scans.map(function (s) {
          return '<option value="' + esc(s.id) + '"' + (state.scanId === s.id ? ' selected' : '') + '>' +
            fmtDate(s.createdAt) + ' · ' + esc(s.branch) + ' · ' + esc(projectName(s.projectId)) + '</option>';
        }).join('');
      scanSel.disabled = scans.length === 0;
    }
  }

  function bindFilterUI() {
    var branchSel = $('#branchSelect');
    if (branchSel) branchSel.addEventListener('change', function () {
      state.branch = branchSel.value;
      state.scanId = '';
      renderFilterOptions();
      renderAll();
    });
    var scanSel = $('#scanSelect');
    if (scanSel) scanSel.addEventListener('change', function () {
      state.scanId = scanSel.value;
      renderAll();
    });
    var search = $('#searchInput');
    if (search) {
      var timer = null;
      search.addEventListener('input', function () {
        clearTimeout(timer);
        timer = setTimeout(function () { state.q = search.value; renderAll(); }, 120);
      });
    }
    var reset = $('#resetFiltersBtn');
    if (reset) reset.addEventListener('click', function () {
      state.q = ''; state.branch = ''; state.scanId = '';
      state.sevs = new Set(ALL_SEVS);
      var s = $('#searchInput'); if (s) s.value = '';
      renderFilterOptions(); renderAll();
      toast('已重置筛选条件', 'info', 1500);
    });
    var exportBtn = $('#exportBtn');
    if (exportBtn) exportBtn.addEventListener('click', exportCsv);
  }

  /* ----------------------------------------------------------------------
     严重级别筛选
     ---------------------------------------------------------------------- */
  function updateSeverityUI() {
    var searchable = withSearch(ctxFindings());
    var counts = { CRITICAL: 0, HIGH: 0, MEDIUM: 0, LOW: 0, INFO: 0 };
    searchable.forEach(function (f) { if (counts[f.severity] != null) counts[f.severity]++; });
    $$('[data-sev]').forEach(function (el) {
      var sev = el.getAttribute('data-sev');
      if (ALL_SEVS.indexOf(sev) < 0) return;
      var on = state.sevs.has(sev);
      el.classList.toggle('on', on);
      el.classList.toggle('off', !on);
      el.setAttribute('aria-pressed', on ? 'true' : 'false');
      $$('[data-count]', el).forEach(function (n) { n.textContent = counts[sev]; });
    });
    var totalEl = $('#totalCount');
    if (totalEl) totalEl.textContent = searchable.length;
  }

  function bindSeverityUI() {
    $$('[data-sev]').forEach(function (el) {
      var sev = el.getAttribute('data-sev');
      if (ALL_SEVS.indexOf(sev) < 0) return;
      el.addEventListener('click', function () {
        var next = new Set(state.sevs);
        if (next.has(sev)) {
          if (next.size === 1) { toast('至少保留一个严重级别', 'err'); return; }
          next.delete(sev);
        } else {
          next.add(sev);
        }
        state.sevs = next;
        updateSeverityUI();
        renderTable();
      });
    });
  }

  /* ----------------------------------------------------------------------
     表格
     ---------------------------------------------------------------------- */
  function visibleCols() {
    var showProject = state.projects.size !== 1;
    return TABLE_COLS.filter(function (c) { return c.key !== 'project' || showProject; });
  }

  function renderTable() {
    var cols = visibleCols();
    var head = $('#resultsHead');
    if (head) {
      head.innerHTML = '<tr>' + cols.map(function (c) {
        var sortable = ['severity', 'query', 'file', 'state', 'found'].indexOf(c.key) >= 0;
        var arrow = '';
        if (state.sort.key === c.key) arrow = '<span class="arrow">' + (state.sort.dir > 0 ? '▲' : '▼') + '</span>';
        return '<th' + (sortable ? ' class="sortable" data-sort="' + c.key + '"' : '') +
          (c.width ? ' style="width:' + c.width + '"' : '') + '>' + esc(c.label) + arrow + '</th>';
      }).join('') + '</tr>';
      $$('#resultsHead th[data-sort]').forEach(function (th) {
        th.addEventListener('click', function () {
          var key = th.getAttribute('data-sort');
          if (state.sort.key === key) state.sort.dir *= -1;
          else { state.sort.key = key; state.sort.dir = 1; }
          renderTable();
        });
      });
    }

    state.rows = currentRows();
    var body = $('#resultsBody');
    if (!body) return;
    if (!state.rows.length) {
      body.innerHTML = '<tr class="empty-row"><td colspan="' + cols.length + '">' +
        '<div class="empty-state" style="height:220px"><div class="big">🔍</div>' +
        '<h3>没有匹配的漏洞</h3><p>调整项目、分支、扫描时间或严重级别筛选条件后再试。</p></div></td></tr>';
    } else {
      body.innerHTML = state.rows.map(function (f) {
        var cells = {
          severity: '<span class="pill sev-' + esc(f.severity) + '">' + esc(f.severity) + '</span>',
          query: '<div class="vuln-name">' + esc(f.queryName) + '</div>' +
            '<div class="vuln-sub"><span class="mono">CWE-' + esc(f.cwe) + '</span><span>·</span><span>' + esc(f.language) + '</span>' +
            (f.status === 'RECURRENT' ? '<span class="pill status st-RECURRENT">复现</span>' : '') + '</div>',
          project: '<span class="proj-cell"><i class="sev-dot" style="background:' + esc(projectColor(f.projectId)) + '"></i>' + esc(projectName(f.projectId)) + '</span>',
          file: '<div class="file-cell" title="' + esc(f.file) + '">' + esc(f.file.split('/').slice(-2).join('/')) + '<i>:' + esc(f.line) + '</i></div>',
          state: '<span class="pill state st-' + esc(f.state) + '">' + esc(STATE_LABEL[f.state] || f.state) + '</span>',
          found: '<span title="' + esc(fmtDate(f.foundAt)) + '">' + esc(relTime(f.foundAt)) + '</span>'
        };
        return '<tr data-id="' + esc(f.id) + '"' + (state.selectedId === f.id ? ' class="selected"' : '') + '>' +
          cols.map(function (c) { return '<td>' + (cells[c.key] || '') + '</td>'; }).join('') + '</tr>';
      }).join('');
      $$('#resultsBody tr[data-id]').forEach(function (tr) {
        tr.addEventListener('click', function () {
          var id = tr.getAttribute('data-id');
          if (state.selectedId === id && CFG.detailMode !== 'inspector') { closeDetail(); return; }
          openDetail(id);
        });
      });
    }

    var countEl = $('#resultCount');
    if (countEl) {
      var total = withSearch(ctxFindings()).length;
      countEl.textContent = state.rows.length === total
        ? '共 ' + total + ' 个漏洞'
        : '筛选出 ' + state.rows.length + ' / ' + total + ' 个漏洞';
    }
  }

  function renderAll() {
    updateSeverityUI();
    renderTable();
    if (state.selectedId) {
      var f = findingById(state.selectedId);
      if (!f || state.rows.indexOf(f) < 0) {
        if (CFG.detailMode === 'inspector') { state.selectedId = null; closeDetail(); }
      }
    }
    updateDetailNav();
  }

  /* ----------------------------------------------------------------------
     漏洞详情
     ---------------------------------------------------------------------- */
  function metaItem(k, v, mono) {
    return '<div class="m"><div class="k">' + esc(k) + '</div><div class="v' + (mono ? ' mono' : '') + '" title="' + esc(v) + '">' + esc(v) + '</div></div>';
  }

  function detailHtml(f) {
    var rem = f.remediation || {};
    var refs = rem.refs || [];
    var examples = rem.examples || [];
    var wide = isWideDetail();

    var cmp = examples.map(function (ex) {
      return '<div class="cmp-title" style="font-size:12px;font-weight:650;color:var(--text-2);margin:10px 0 6px;display:flex;gap:8px;align-items:center">' +
        esc(ex.title) + '<span class="badge-soft">' + esc(ex.lang || '') + '</span></div>' +
        '<div class="' + (wide ? 'cmp-grid' : 'cmp') + '">' +
        '<div class="code-card bad"><div class="c-head"><span class="t">✗ 错误示例</span><span class="lang">before</span></div><pre>' + esc(ex.bad) + '</pre></div>' +
        '<div class="code-card good"><div class="c-head"><span class="t">✓ 修复后</span><span class="lang">after</span></div><pre>' + esc(ex.good) + '</pre></div>' +

        '<div class="fl-head"><span class="fl-file">' + esc(n.file) + '</span><span class="fl-line">:' + esc(n.line) + '</span>' +
        '<span class="fl-tag">' + esc(n.label) + '</span></div>' +
        '<code>' + esc(n.code) + '</code></li>';

      '<div class="payload"><div class="p-head"><span>攻击示例 / payload</span>' +
      '<button type="button" class="btn ghost sm" data-copy-payload>复制</button></div>' +
      '<pre>' + esc(f.payload) + '</pre></div>' : '';

    return '' +
      '<div class="dt-head">' +
      '<div class="dt-title-row"><div>' +
      '<div class="dt-title">' + esc(f.queryName) + '</div>' +
      '<div class="dt-sub"><span>' + esc(f.groupName) + '</span><span>·</span><span>' + esc(f.language) + '</span>' +
      '<span>·</span><span>' + esc(projectName(f.projectId)) + '</span></div>' +
      '</div></div>' +
      '<div class="dt-badges">' +
      '<span class="pill sev-' + esc(f.severity) + '">' + esc(f.severity) + ' · ' + esc(SEV_LABEL[f.severity] || '') + '</span>' +
      '<span class="pill state st-' + esc(f.state) + '">' + esc(STATE_LABEL[f.state] || f.state) + '</span>' +
      '<span class="pill status st-' + esc(f.status) + '">' + esc(STATUS_LABEL[f.status] || f.status) + '</span>' +
      '<span class="badge-soft">CWE-' + esc(f.cwe) + ' ' + esc(f.cweName || '') + '</span>' +
      '</div></div>' +
      '<div class="dt-meta">' +
      metaItem('项目', projectName(f.projectId)) +
      metaItem('分支', branchOf(f)) +
      metaItem('扫描时间', scanTimeOf(f)) +
      metaItem('扫描 ID', scanOf(f).id || f.scanId, true) +
      metaItem('文件', f.file, true) +
      metaItem('行 / 列', f.line + ' : ' + (f.column || 1)) +
      metaItem('首次发现', fmtDate(f.foundAt)) +
      metaItem('结果 ID', f.id, true) +
      '</div>' +
      '<div class="dt-body">' +
      '<section class="dt-sec"><h4>漏洞说明 <span class="en">description</span></h4><p>' + esc(f.description) + '</p></section>' +
      '<section class="dt-sec"><h4>攻击向量 <span class="en">attack vector</span></h4><p>' + esc(f.attackVector) + '</p>' + payload + '</section>' +
      (flow ? '<section class="dt-sec"><h4>污点数据流 <span class="en">data flow</span><span class="count">' + (f.dataFlow || []).length + ' 步</span></h4><ol class="flow">' + flow + '</ol></section>' :
        '<section class="dt-sec"><h4>污点数据流 <span class="en">data flow</span></h4><p class="hint">该结果由配置类检查产生，无数据流信息。</p></section>') +

  function findRowIndex() {
    if (!state.selectedId) return -1;
    for (var i = 0; i < state.rows.length; i++) if (state.rows[i].id === state.selectedId) return i;
    return -1;
  }

  function updateDetailNav() {
    var idx = findRowIndex();
    $$('.detail-nav').forEach(function (nav) {
      var pos = nav.querySelector('.pos');
      if (pos) pos.textContent = idx >= 0 ? (idx + 1) + ' / ' + state.rows.length : '';
      var prev = nav.querySelector('[data-detail-nav="prev"]');
      var next = nav.querySelector('[data-detail-nav="next"]');
      if (prev) prev.disabled = idx <= 0;
      if (next) next.disabled = idx < 0 || idx >= state.rows.length - 1;
    });
  }

  function openDetail(id) {
    var f = findingById(id);
    if (!f) return;
    state.selectedId = id;
    $$('#resultsBody tr[data-id]').forEach(function (tr) {
      tr.classList.toggle('selected', tr.getAttribute('data-id') === id);
    });
    var content = $('#detailContent');
    if (!content) return;
    content.innerHTML = detailHtml(f);
    content.scrollTop = 0;
    var empty = $('#detailEmpty');
    if (empty) empty.classList.add('hidden');
    if (CFG.detailMode === 'drawer') {
      $('#detailDrawer').classList.add('open');
      $('#detailDrawer').setAttribute('aria-hidden', 'false');
      $('#detailBackdrop').classList.add('open');
    } else if (CFG.detailMode === 'modal') {
      $('#detailModal').classList.add('open');
    } else {
      var scroll = content.closest('.insp-scroll');
      if (scroll) scroll.scrollTop = 0;
    }
    updateDetailNav();
  }

  function closeDetail() {
    state.selectedId = null;
    var empty = $('#detailEmpty');
    if (empty) empty.classList.remove('hidden');
    if (CFG.detailMode === 'drawer') {
      var d = $('#detailDrawer'); if (d) { d.classList.remove('open'); d.setAttribute('aria-hidden', 'true'); }
      var b = $('#detailBackdrop'); if (b) b.classList.remove('open');
    } else if (CFG.detailMode === 'modal') {
      var m = $('#detailModal'); if (m) m.classList.remove('open');
    }
    $$('#resultsBody tr[data-id]').forEach(function (tr) { tr.classList.remove('selected'); });
    updateDetailNav();
  }

  function navigateDetail(dir) {
    var idx = findRowIndex();
    if (idx < 0) { if (state.rows.length) openDetail(state.rows[0].id); return; }
    var next = idx + (dir === 'prev' ? -1 : 1);
    if (next < 0 || next >= state.rows.length) return;
    openDetail(state.rows[next].id);
    var selectedRow = $('#resultsBody tr.selected');
    if (selectedRow && selectedRow.scrollIntoView) selectedRow.scrollIntoView({ block: 'nearest' });
  }

  function handleDetailAction(act) {
    var f = findingById(state.selectedId);
    if (!f) return;
    if (act === 'confirm') { f.state = 'CONFIRMED'; toast('已标记为「已确认」（演示）', 'ok', 1800); }
    else if (act === 'ignore') { f.state = 'IGNORED'; toast('已忽略该漏洞（演示）', 'info', 1800); }
    else if (act === 'open-cx') { toast('演示环境：真实版本将跳转 ' + (MOCK.tenant.web || 'https://checkmarx.net') + ' 对应扫描结果', 'info', 2400); return; }
    renderAll();
    openDetail(f.id);
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast('已复制到剪贴板', 'ok', 1500); },
        function () { fallbackCopy(text); });
    } else fallbackCopy(text);
  }
  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('已复制到剪贴板', 'ok', 1500); } catch (e) { toast('复制失败，请手动选择', 'err'); }
    ta.remove();
  }

  var scanState = { running: false, folders: [''], results: [] };

  function folderRowHtml(path, idx) {

      '<span class="idx">' + (idx + 1) + '</span>' +
      '<span class="path-wrap"><input type="text" class="fpath" spellcheck="false" placeholder="E:\\projects\\my-service（或点击浏览）" value="' + esc(path || '') + '">' +
      '<button type="button" class="btn sm browse" data-browse>浏览…</button></span>' +

  function mountScan() {
    var layer = document.createElement('div');
    layer.className = 'modal-layer';
    layer.id = 'scanModal';
    layer.innerHTML =
      '<div class="modal" style="width:820px">' +
      '<div class="modal-head"><div><div class="m-title">本地扫描 · 指定文件夹</div>' +
      '<div class="m-sub">对本地代码文件夹发起 Checkmarx One 扫描，支持一次提交多个项目</div></div>' +
      '<button class="icon-btn close" data-close-modal="scanModal">✕</button></div>' +
      '<div class="modal-body">' +
      '<p class="scan-lead">选择需要扫描的本地文件夹（可添加多个，每个文件夹对应一个 Checkmarx One 项目）。扫描在本地打包后上传，代码不会经过第三方服务器。</p>' +
      '<div class="scan-callout"><span class="i">ⓘ</span><span>演示环境仅模拟扫描流程；真实版本通过本地代理调用 Checkmarx One API / CLI 执行扫描并自动加载结果。</span></div>' +
      '<div class="scan-folder-labels"><span>#</span><span>本地文件夹</span><span>Checkmarx One 项目名</span><span></span></div>' +
      '<div class="scan-folders" id="scanFolders"></div>' +
      '<div class="actions" style="margin-top:9px"><button class="btn sm ghost" id="addFolderBtn">＋ 添加文件夹</button>' +
      '<span class="muted" style="font-size:11px">支持多项目并行扫描</span></div>' +
      '<div class="scan-options">' +
      '<label class="opt">分支 <input type="text" id="scanBranch" value="main"></label>' +
      '<label class="opt"><input type="checkbox" id="scanSast" checked> SAST</label>' +
      '<label class="opt"><input type="checkbox" id="scanSca"> SCA</label>' +

      '</div>' +

      '</div>' +
