<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CxScope · Demo 3 深色作战室（弹窗详情）</title>
<style>
/*__CORE_CSS__*/

/* ============================ Demo 3 布局（深色） ============================ */
body {
  background:
    radial-gradient(1200px 720px at 12% -12%, rgba(37, 99, 235, .18), transparent 60%),
    radial-gradient(1000px 640px at 108% -6%, rgba(6, 182, 212, .13), transparent 55%),
    var(--bg);
}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image: linear-gradient(rgba(148, 163, 184, .045) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(148, 163, 184, .045) 1px, transparent 1px);
  background-size: 40px 40px;
  mask-image: radial-gradient(1000px 700px at 50% 0%, #000 0%, transparent 78%);
}
#app { position: relative; z-index: 1; height: 100vh; display: flex; flex-direction: column; min-height: 0; }

/* 顶栏 */
.topbar {
  flex: none; height: 56px; display: flex; align-items: center; gap: 14px; padding: 0 18px;
  border-bottom: 1px solid var(--border);
  background: color-mix(in srgb, var(--panel) 62%, transparent);
  backdrop-filter: blur(12px);
}
.brand { display: flex; align-items: center; gap: 10px; flex: none; }
.brand .logo {
  width: 30px; height: 30px; border-radius: 9px;
  background: linear-gradient(135deg, #3b82f6, #06b6d4);
  display: flex; align-items: center; justify-content: center;
  color: #04101f; font-weight: 900; font-size: 12.5px; letter-spacing: -.5px;
  box-shadow: 0 0 22px rgba(59, 130, 246, .45);
}
.brand .name { font-size: 14.5px; font-weight: 750; letter-spacing: -.25px; line-height: 1.15; }
.brand .sub { font-size: 10.5px; color: var(--faint); letter-spacing: .3px; }
.demo-badge {
  font-size: 10px; font-weight: 700; letter-spacing: .7px;
  color: #67e8f9; background: rgba(6, 182, 212, .1);
  border: 1px solid rgba(6, 182, 212, .3);
  padding: 3px 8px; border-radius: 999px; white-space: nowrap;
}
.back-link { color: var(--faint); font-size: 11.5px; }
.back-link:hover { color: #67e8f9; }
.topbar .spacer { flex: 1; }
.topbar-actions { display: flex; align-items: center; gap: 8px; flex: none; }

/* 筛选栏：项目 Tab + 分支 + 扫描时间 + 搜索 同一排 */
.filterbar {
  flex: none; display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
  padding: 10px 18px; border-bottom: 1px solid var(--border);
  background: color-mix(in srgb, var(--bg) 55%, transparent);
}
#projectChips { display: flex; align-items: center; gap: 6px; max-width: 44vw; overflow-x: auto; padding: 2px; }
#projectChips::-webkit-scrollbar { height: 4px; }
.proj-tab {
  display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 10px;
  border-radius: 999px; border: 1px solid var(--border);
  background: transparent; color: var(--muted);
  font-size: 12px; font-weight: 550; white-space: nowrap;
  transition: all .15s;
}
.proj-tab:hover { color: var(--text-2); border-color: var(--border-strong); }
.proj-tab.on {
  color: var(--text); border-color: rgba(59, 130, 246, .4);
  background: rgba(59, 130, 246, .12); box-shadow: inset 0 0 18px rgba(59, 130, 246, .07);
}
.proj-tab .p-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.proj-tab .p-n {
  font-size: 10px; font-weight: 750; line-height: 16px; padding: 0 5px; border-radius: 8px;
  background: var(--high-soft); color: var(--high);
}
.divider-v { width: 1px; height: 20px; background: var(--border-strong); margin: 0 3px; flex: none; }
.filterbar .searchbox { flex: 1; min-width: 190px; max-width: 380px; }
.filterbar .spacer { flex: 1; }

/* 严重级别 / 工具行 */
.sev-row {
  flex: none; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 10px 18px; border-bottom: 1px solid var(--border);
  background: color-mix(in srgb, var(--bg) 40%, transparent);
}
.sev-row .spacer { flex: 1; }
.sev-row .count { color: var(--faint); font-size: 12px; padding: 0 4px; }
.sev-row .divider-v { margin: 0 2px; }
.sev-row .total-chip { color: var(--muted); font-size: 12px; }
.sev-row .total-chip b { color: var(--text); }

/* 看板主体 */
.board { flex: 1; min-height: 0; padding: 14px 18px 16px; display: flex; }
.board .table-wrap {
  flex: 1; background: color-mix(in srgb, var(--panel) 82%, transparent);
  border-color: var(--border); box-shadow: 0 30px 80px -40px rgba(0, 0, 0, .9);
  backdrop-filter: blur(6px);
}
table.results thead th { background: color-mix(in srgb, var(--panel-2) 90%, transparent); }
table.results tbody tr { height: 50px; }
table.results tbody tr:hover { background: rgba(59, 130, 246, .06); }
table.results tbody tr.selected { background: rgba(59, 130, 246, .13); }
.sev-chip { background: color-mix(in srgb, var(--panel) 70%, transparent); }
.control { background: color-mix(in srgb, var(--panel) 72%, transparent); }
.searchbox { background: color-mix(in srgb, var(--panel) 72%, transparent); }
.empty-row .empty-state { height: 320px !important; }

/* 深色详情弹窗点缀 */
.detail-modal-layer .modal {
  border-color: rgba(59, 130, 246, .22);
  box-shadow: 0 40px 120px rgba(0, 0, 0, .8), 0 0 0 1px rgba(59, 130, 246, .06);
}
.detail-modal-layer .dt-head { background: linear-gradient(180deg, rgba(59, 130, 246, .07), transparent 70%); }
.detail-modal-layer .drawer-top { background: color-mix(in srgb, var(--panel-2) 85%, transparent); }

@media (max-width: 1280px) {
  .demo-badge, .back-link { display: none; }
  #projectChips { max-width: 40vw; }
}
@media (max-width: 1024px) {
  .filterbar .searchbox { max-width: 100%; flex-basis: 100%; }
}
</style>
</head>
<body>
<div id="app">

  <!-- ============================ 顶栏 ============================ -->
  <header class="topbar">
    <div class="brand">
      <div class="logo">CX</div>
      <div>
        <div class="name">CxScope</div>
        <div class="sub">Checkmarx One · 深色作战室</div>
      </div>
    </div>
    <span class="demo-badge">DEMO 3 · 深色作战室</span>
    <a class="back-link" href="index.html">← 全部 Demo</a>
    <span class="spacer"></span>
    <div class="topbar-actions">
      <span class="conn-pill" id="connPill"><span class="pulse"></span>未连接</span>
      <button class="btn primary" id="localScanBtn" type="button">＋ 本地扫描</button>
      <button class="icon-btn" id="settingsBtn" type="button" title="连接设置">⚙</button>
    </div>
  </header>

  <!-- ============ 项目 / 分支 / 扫描时间 / 搜索 同一排 ============ -->
  <section class="filterbar">
    <div id="projectChips"></div>
    <span class="divider-v"></span>
    <label class="control" title="按分支筛选">
      <span class="lbl">分支</span>
      <select id="branchSelect"><option value="">全部分支</option></select>
    </label>
    <label class="control" title="按扫描时间筛选">
      <span class="lbl">扫描时间</span>
      <select id="scanSelect"><option value="">最近一次扫描</option></select>
    </label>
    <label class="searchbox">🔍<input id="searchInput" type="text" placeholder="搜索漏洞 / 文件 / CWE / 描述…" /></label>
    <span class="spacer"></span>
    <span class="count" id="resultCount"></span>
    <button class="btn ghost" id="resetFiltersBtn" type="button">重置</button>
    <button class="btn ghost" id="exportBtn" type="button">导出 CSV</button>
  </section>

  <!-- ======================= 严重级别筛选 ======================= -->
  <section class="sev-row">
    <button class="sev-chip on" data-sev="CRITICAL" type="button"><span class="dot"></span>Critical <span class="n" data-count>0</span></button>
    <button class="sev-chip on" data-sev="HIGH" type="button"><span class="dot"></span>High <span class="n" data-count>0</span></button>
    <button class="sev-chip on" data-sev="MEDIUM" type="button"><span class="dot"></span>Medium <span class="n" data-count>0</span></button>
    <button class="sev-chip on" data-sev="LOW" type="button"><span class="dot"></span>Low <span class="n" data-count>0</span></button>
    <button class="sev-chip on" data-sev="INFO" type="button"><span class="dot"></span>Info <span class="n" data-count>0</span></button>
    <span class="divider-v"></span>
    <span class="total-chip">当前共 <b id="totalCount">0</b> 个漏洞</span>
    <span class="spacer"></span>
    <span class="muted" style="font-size:11.5px">点击严重级别标签即可筛选 · 点击任意行打开详情弹窗</span>
  </section>

  <!-- ======================= 结果表格 ======================= -->
  <main class="board">
    <div class="table-wrap">
      <table class="results">
        <thead id="resultsHead"></thead>
        <tbody id="resultsBody"></tbody>
      </table>
    </div>
  </main>
</div>

<script>
window.MOCK = /*__MOCK__*/;
</script>
<script>

  brand: 'CxScope',
  product: 'Checkmarx One',
  subtitle: '深色作战室',
  detailMode: 'modal',
  theme: 'dark',
  autoLogin: false
};
</script>
<script>

</script>
</body>
</html>
