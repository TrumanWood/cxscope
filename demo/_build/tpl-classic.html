<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CxScope · Demo 1 经典控制台（抽屉详情）</title>
<style>
/*__CORE_CSS__*/

/* ============================ Demo 1 布局 ============================ */
body {
  background: linear-gradient(180deg, #f4f7fb 0%, #edf1f7 55%, #e9eef6 100%);
}

#app { height: 100vh; display: flex; flex-direction: column; min-height: 0; }

/* 顶栏 */
.topbar {
  flex: none; height: 62px; display: flex; align-items: center; gap: 16px;
  padding: 0 20px; background: var(--panel);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 1px 0 rgba(15, 23, 42, .02), 0 8px 24px -22px rgba(15, 23, 42, .35);
  position: relative; z-index: 30;
}
.brand { display: flex; align-items: center; gap: 10px; flex: none; }
.brand .logo {
  width: 31px; height: 31px; border-radius: 9px;
  background: linear-gradient(135deg, #2563eb, #06b6d4);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 800; font-size: 12.5px; letter-spacing: -.5px;
  box-shadow: 0 5px 14px rgba(37, 99, 235, .32);
}
.brand .name { font-size: 14.5px; font-weight: 750; letter-spacing: -.25px; line-height: 1.15; }
.brand .sub { font-size: 10.5px; color: var(--faint); letter-spacing: .2px; }
.demo-badge {
  margin-left: 4px; flex: none;
  font-size: 10px; font-weight: 700; letter-spacing: .7px;
  color: var(--primary); background: var(--primary-soft);
  border: 1px solid color-mix(in srgb, var(--primary) 25%, transparent);
  padding: 3px 8px; border-radius: 999px; white-space: nowrap;
}
.back-link { color: var(--faint); font-size: 11.5px; margin-left: 2px; white-space: nowrap; }
.back-link:hover { color: var(--primary); }

/* 顶栏筛选（项目 / 分支 / 扫描时间 同一排） */
.filter-row { display: flex; align-items: center; gap: 9px; flex: 1; min-width: 0; padding-left: 6px; }
.picker-wrap { position: relative; flex: none; }
#projectMenu { top: calc(100% + 7px); left: 0; }
.topbar-actions { display: flex; align-items: center; gap: 8px; flex: none; }

/* 看板工具条 */
.board-toolbar {
  flex: none; display: flex; align-items: center; justify-content: space-between;
  gap: 14px; padding: 12px 20px 11px; flex-wrap: wrap;
}
.sev-chips { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.sev-chips .divider-v { width: 1px; height: 20px; background: var(--border-strong); margin: 0 4px; opacity: .7; }
.total-chip { color: var(--muted); font-size: 12px; margin-left: 2px; }
.total-chip b { color: var(--text); font-weight: 750; }
.toolbar-right { display: flex; align-items: center; gap: 8px; }
.count { color: var(--faint); font-size: 12px; padding: 0 4px; }

/* 看板主体：占满剩余高度，仅表格内部滚动 */
.board { flex: 1; min-height: 0; padding: 0 20px 18px; display: flex; }
.board .table-wrap { flex: 1; box-shadow: 0 10px 30px -26px rgba(15, 23, 42, .5); }

table.results thead th { padding-top: 11px; padding-bottom: 11px; }
table.results tbody tr { height: 50px; }

/* 筛选为空时的提示 */
.empty-row .empty-state { height: 300px !important; }

@media (max-width: 1280px) {
  .brand .sub, .back-link { display: none; }
  .searchbox { min-width: 170px; }
  .demo-badge { display: none; }
}
@media (max-width: 1024px) {
  .topbar { height: auto; flex-wrap: wrap; padding: 10px 14px; }
  .filter-row { order: 3; width: 100%; padding-left: 0; }
}
</style>
</head>
<body>
<div id="app">

  <!-- ======================= 顶栏：项目 / 分支 / 扫描时间 同一排 ======================= -->
  <header class="topbar">
    <div class="brand">
      <div class="logo">CX</div>
      <div>
        <div class="name">CxScope</div>
        <div class="sub">Checkmarx One · SAST 漏洞看板</div>
      </div>
    </div>
    <span class="demo-badge">DEMO 1 · 经典控制台</span>
    <a class="back-link" href="index.html">← 全部 Demo</a>

    <div class="filter-row">
      <div class="picker-wrap">
        <button class="control" id="projectPickerBtn" type="button" title="选择项目（可多选）">
          <span class="lbl">项目</span>
          <span class="val">全部项目</span>
          <span class="caret">▾</span>
        </button>
        <div class="popover hidden" id="projectMenu"></div>
      </div>
      <label class="control" title="按分支筛选">
        <span class="lbl">分支</span>
        <select id="branchSelect"><option value="">全部分支</option></select>
      </label>
      <label class="control" title="按扫描时间筛选">
        <span class="lbl">扫描时间</span>
        <select id="scanSelect"><option value="">最近一次扫描</option></select>
      </label>
    </div>

    <div class="topbar-actions">
      <span class="conn-pill" id="connPill"><span class="pulse"></span>未连接</span>
      <button class="btn primary" id="localScanBtn" type="button">＋ 本地扫描</button>
      <button class="icon-btn" id="settingsBtn" type="button" title="连接设置">⚙</button>
    </div>
  </header>

  <!-- ======================= 严重级别筛选 + 搜索 ======================= -->
  <section class="board-toolbar">
    <div class="sev-chips" id="sevChips">
      <button class="sev-chip on" data-sev="CRITICAL" type="button"><span class="dot"></span>Critical <span class="n" data-count>0</span></button>
      <button class="sev-chip on" data-sev="HIGH" type="button"><span class="dot"></span>High <span class="n" data-count>0</span></button>
      <button class="sev-chip on" data-sev="MEDIUM" type="button"><span class="dot"></span>Medium <span class="n" data-count>0</span></button>
      <button class="sev-chip on" data-sev="LOW" type="button"><span class="dot"></span>Low <span class="n" data-count>0</span></button>
      <button class="sev-chip on" data-sev="INFO" type="button"><span class="dot"></span>Info <span class="n" data-count>0</span></button>
      <span class="divider-v"></span>
      <span class="total-chip">当前共 <b id="totalCount">0</b> 个漏洞</span>
    </div>
    <div class="toolbar-right">
      <label class="searchbox">🔍<input id="searchInput" type="text" placeholder="搜索漏洞 / 文件 / CWE / 描述…" /></label>
      <span class="count" id="resultCount"></span>
      <button class="btn ghost" id="resetFiltersBtn" type="button">重置</button>
      <button class="btn ghost" id="exportBtn" type="button">导出 CSV</button>
    </div>
  </section>

  <!-- ======================= 结果表格（内部滚动） ======================= -->
  <main class="board">
    <div class="table-wrap">
      <table class="results">
        <thead id="resultsHead"></thead>
        <tbody id="resultsBody"></tbody>
      </table>
    </div>
  </main>
</div>

<script>
window.MOCK = /*__MOCK__*/;
</script>
<script>
window.CX_DEMO = {
  brand: 'CxScope',
  title: 'Checkmarx 漏洞看板',
  product: 'Checkmarx One',
  subtitle: 'SAST 漏洞统一看板',
  detailMode: 'drawer',
  theme: 'light',
  autoLogin: false
};
</script>
<script>

</script>
</body>
</html>
